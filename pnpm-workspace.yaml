packages:
  - "services/*"
  # Its own workspace, like an integrator's project: it installs the published connector from GitHub
  # Packages, and in this lockfile that entry would make every install here need a token.
  - "!services/custom-example"
  - "packages/*"
  # Committed EntryPoint v0.9 artifacts and Solidity sources, pinned by this repository.
  - "packages/contracts/vendor/account-abstraction"
  - "e2e"

overrides:
  human-id: "4.1.1"
  # GHSA-mrhx-c7xc-m3w5 — every appkit-wallet release (up to 1.8.24) pins zod 3.22.4 and no
  # release moves to zod 4. Its W3mFrameSchema uses only APIs that behave the same in zod 4.
  "@reown/appkit-wallet>zod": "4.6.7"
  # GHSA-mrhx-c7xc-m3w5 — viem 2.23.2 (via @walletconnect/utils 2.21) pins abitype 1.0.8, whose
  # optional zod peer accepts only zod 3, so pnpm keeps a zod 3 copy for it. 1.2.3 accepts zod 4.
  # Drop this once no parent resolves abitype 1.0.8.
  "abitype@1.0.8": "1.2.3"
  # Security floors for transitive deps (dependency audit, 2026-09). Each selector lifts only the
  # vulnerable range of one version line; drop an entry once its parents resolve past it.
  # GHSA-v6h2-p8h4-qcjw, GHSA-f886-m6hf-6m8v, GHSA-3jxr-9vmj-r5cp, GHSA-mh99-v99m-4gvg, GHSA-rgw5-rvv9-x895
  "brace-expansion@>=2.0.0 <2.1.4": "2.1.7"
  # GHSA-qr28-fpjm-wq7f (high), GHSA-vcc3-ghjq-m6fr — query-string 7.1.3 (via @walletconnect/utils)
  # asks for 0.2.x and only 0.5.1 is fixed. 0.5.1 is ESM-only, which query-string 7 cannot require(),
  # but no installed code imports query-string, so the package is never loaded. Check that again
  # before you drop or change this entry.
  "decode-uri-component@<0.5.1": "0.5.1"
  # GHSA-gcqx-w48m-w2h4 — RainbowKit pins @vanilla-extract/css 1.20.1, which uses deepmerge 4. No fixed
  # deepmerge release exists; @vanilla-extract/css 1.21.3 replaces deepmerge with deepmerge-ts.
  "@vanilla-extract/css@>=1.0.0 <1.21.3": "1.21.3"
  # GHSA-52f5-9888-hmc6, GHSA-ph9p-34f9-6g65 — solc pins tmp 0.0.33; no fixed 0.0.x release.
  "tmp@<0.2.6": "0.2.7"
  # GHSA-vrm6-8vpv-qv8q et al. (11 advisories) — hardhat, hardhat-verify and testcontainers ask for
  # undici 5; no fixed 5.x release exists.
  "undici@>=5.0.0 <6.28.0": "6.29.1"
  # GHSA-qj3p-xc97-xw74 — via @wagmi/connectors 5.8; 0.33.1 is what @wagmi/connectors 5.11 pins.
  "@metamask/sdk@>=0.16.0 <0.33.1": "0.33.1"
  "@metamask/sdk-communication-layer@>=0.16.0 <0.33.1": "0.33.1"
  # GHSA-q6x5-8v7m-xcrf
  "@protobufjs/utf8@<1.1.1": "1.1.2"
  # GHSA-2g4f-4pwh-qvx6
  "ajv@>=8.0.0 <8.18.0": "8.20.0"
  # GHSA-378v-28hj-76wf
  "bn.js@>=5.0.0 <5.2.3": "5.2.5"
  # h3 advisories (moderate + high) — unstorage via WalletConnect
  "h3@>=1.0.0 <1.15.9": "1.15.11"
  # js-yaml advisories (moderate + high)
  "js-yaml@>=3.0.0 <3.15.2": "3.15.2"
  "js-yaml@>=4.0.0 <4.3.2": "4.3.2"
  # lodash advisories (moderate + high)
  "lodash@<4.18.0": "4.18.1"
  # picomatch advisories (moderate + high)
  "picomatch@>=2.0.0 <2.3.2": "2.3.2"
  "picomatch@>=3.0.0 <3.0.2": "3.0.2"
  # postcss advisory — tsup, vite
  "postcss@>=8.0.0 <8.5.23": "8.5.31"
  # protobufjs advisories (critical + high + moderate) — @grpc/proto-loader, dockerode (testcontainers)
  "protobufjs@>=7.0.0 <7.6.3": "7.6.6"
  # uuid advisory — hardhat, @metamask/*, dockerode ask for 8–10; no fixed release on those lines.
  "uuid@<11.1.1": "11.1.1"
  # ws advisories (moderate + high)
  "ws@>=7.0.0 <7.5.11": "7.5.13"
  "ws@>=8.0.0 <8.21.0": "8.22.0"
  # yaml advisory
  "yaml@>=1.0.0 <1.10.3": "1.10.3"
  "yaml@>=2.0.0 <2.8.3": "2.9.1"
  # GHSA-jggr-w7fw-pc2j — pino-pretty (wallet-api dev logging)
  "fast-copy@>=4.0.0 <4.1.0": "4.2.0"
  # GHSA-3g3m-2fjr-6pw4 (glob), GHSA-g3hv-75wg-m249 (minimatch via glob) — archiver-utils 5.0.2
  # (testcontainers) asks for glob 10, @fastify/static 10.1.6 for glob 13; only 14.0.2+ is fixed.
  # glob 14 keeps the glob() and sync() exports both parents call, and brings minimatch 11.
  # Remove once @fastify/static is 10.1.9+ (glob ^14) and testcontainers no longer uses archiver 7.
  "glob@>=9.0.0 <14.0.2": "14.0.3"
  # High-severity lines (lowest advisory on each is high).
  # @grpc/grpc-js — dockerode via testcontainers (wallet-api tests)
  "@grpc/grpc-js@>=1.13.0 <1.13.5": "1.14.6"
  "brace-expansion@>=5.0.0 <5.0.9": "5.0.12"
  "browserslist@>=4.0.0 <4.28.7": "4.29.3"
  "fast-uri@>=3.0.0 <3.1.9": "3.1.9"
  "fast-uri@>=4.0.0 <4.2.3": "4.2.3"
  "find-my-way@>=9.0.0 <9.7.0": "9.10.0"
  "minimatch@>=5.0.0 <5.1.8": "5.1.9"
  # preact — @coinbase/wallet-sdk via wagmi connectors
  "preact@>=10.0.0 <10.26.10": "10.29.8"
  # socket.io-parser — @metamask/sdk via wagmi connectors
  "socket.io-parser@>=4.0.0 <4.2.7": "4.2.7"
  # GHSA-68fv-2mgg-jv7q — magicast via @vitest/coverage-v8, vite, postcss
  "source-map-js@>=1.0.0 <1.2.2": "1.2.2"
  # Critical — ethereum-cryptography (hardhat), create-hash/create-hmac and @coinbase/wallet-sdk.
  "sha.js@>=2.0.0 <2.4.12": "2.4.12"

# Supply-chain policy (ABIP-6, docs/abip-compliance.md): reject any package version published less
# than 7 days ago — the ABIP's tier for projects that handle financial transactions. No package is
# exempt by name or scope. The only allowed exclusion is one exact version (name@x.y.z) of a direct
# dependency carrying a critical security fix, with its advisory and removal date in a comment;
# scripts/check-release-age.mjs enforces all of this in CI.
minimumReleaseAge: 10080

# Exact versions (ABIP-7): `pnpm add` writes `1.2.3`, not `^1.2.3`.
# scripts/check-pinned-versions.mjs enforces this in CI.
saveExact: true

# Native deps left unbuilt (matches pre-pnpm-11 behavior — none were built before).
# Flip any to `true` and reinstall if its build scripts are needed.
allowBuilds:
  "@swc/core": false
  bufferutil: false
  cpu-features: false
  esbuild: false
  keccak: false
  msgpackr-extract: false
  protobufjs: false
  secp256k1: false
  sharp: false
  ssh2: false
  unrs-resolver: false
  utf-8-validate: false
