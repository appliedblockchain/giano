[profile.default]
src = 'src'
out = 'out'
libs = ['node_modules', 'lib']
test = 'test'
script = 'script'
cache_path = 'cache_forge'

# The canonical build. Foundry is the only Solidity toolchain in this repo: `forge build` produces
# what `pnpm release:cut` freezes into releases/<version>/, and the deploy CLI deploys only from a
# release, never from a fresh build. Every setting below reaches the bytecode, so all of them are
# pinned rather than left to Foundry's defaults:
#   - solc and the EVM target. `paris` (no PUSH0, MCOPY or transient storage) keeps one release
#     deployable on every chain we may adopt, including ones that lag on hardforks.
#   - remappings. solc records them in the metadata hash appended to the bytecode, so they are
#     listed in remappings.txt and auto-detection is off: a new package in node_modules must not be
#     able to change the build.
solc_version = '0.8.28'
evm_version = 'paris'
optimizer = true
optimizer_runs = 200
via_ir = true
auto_detect_remappings = false

# Tests install CreateX at its canonical address from the vendored artifact (test/utils/CreateXFixture.sol).
fs_permissions = [{ access = 'read', path = './vendor/createx' }]
