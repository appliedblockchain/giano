[profile.default]
src = 'src'
out = 'out'
libs = ['node_modules', 'lib']
test = 'test'
script = 'script'
cache_path = 'cache_forge'

# The canonical build. Foundry is the only Solidity toolchain in this repo: `forge build` produces
# what `pnpm release:cut` freezes into releases/<version>/, and the deploy CLI deploys only from a
# release, never from a fresh build. Every setting below reaches the bytecode, so all of them are
# pinned rather than left to Foundry's defaults:
#   - solc and the EVM target. EntryPoint v0.9 requires Cancun (MCOPY and transient storage).
#     Chains that have not activated those opcodes cannot run this release.
#   - remappings. solc records them in the metadata hash appended to the bytecode, so they are
#     listed in remappings.txt and auto-detection is off: a new package in node_modules must not be
#     able to change the build.
solc_version = '0.8.28'
evm_version = 'cancun'
optimizer = true
optimizer_runs = 200
via_ir = true
auto_detect_remappings = false

# Fail the build on any solc warning, so CI (`forge test`) catches them. Foundry applies this after
# compiling; it does not reach the bytecode.
deny = 'warnings'

# Tests install CreateX at its canonical address from the vendored artifact (test/utils/CreateXFixture.sol).
# Validation.t.sol reads paymaster.ts, to check that the off-chain MIN_POST_OP_GAS_LIMIT matches the contract.
fs_permissions = [
    { access = 'read', path = './vendor/createx' },
    { access = 'read', path = './paymaster.ts' },
]

# `deny` also applies to forge-lint, and the linter's current findings are deliberate (selector and
# bit-flag casts). Keep the linter out of the build; run `forge lint` to see its findings.
[lint]
lint_on_build = false
