[profile.default]
src = 'src'
out = 'out'
libs = ['node_modules', 'lib']
test = 'test'
cache_path  = 'cache_forge'

# Match the canonical Hardhat settings exactly (solc 0.8.28, optimizer 200, viaIR). Foundry is
# still tests-only, but compiling the same bytecode Hardhat deploys is what makes a gas snapshot
# mean anything — and GianoPaymaster does not fit the legacy code generator's stack at all.
optimizer = true
optimizer_runs = 200
via_ir = true

# Foundry is used for TESTS ONLY. The canonical build/deploy toolchain is Hardhat
# Ignition (solc 0.8.28, optimizer runs 200, viaIR) — see README.md. Deploying with
# any other settings changes CREATE2 addresses. The old divergent [profile.deploy]
# (solc 0.8.23, runs 999999) was removed for that reason.
