<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Giano E2E dApp</title>
  </head>
  <body>
    <h1>Giano thin-SDK E2E fixture</h1>
    <button type="button" id="connect">Connect</button>
    <button type="button" id="send">Send 0 ETH to self</button>
    <!-- An ordinary allow-listed contract call, and one to a contract no tenant sponsors:
         the two halves of a sponsorship allowlist test. -->
    <button type="button" id="send-erc20">Transfer demo ERC-20</button>
    <button type="button" id="send-unlisted">Call an unlisted contract</button>
    <button type="button" id="sign">Sign message</button>
    <button type="button" id="sign-typed">Sign typed data</button>
    <!-- Opens the wallet-management interface (WM-63): the SDK function is the dApp's ONE
         management affordance — no parameters accepted, no owner data returned (WM-39, WM-40). -->
    <button type="button" id="manage">Manage wallet</button>
    <!-- The second chain (MC-121): its OWN provider over the same wallet URL, driving the
         real chain-selection path — nothing simulated (MC-122). -->
    <button type="button" id="connect-chain-b">Connect on chain B</button>
    <button type="button" id="send-chain-b">Send 0 ETH to self on chain B</button>
    <!-- A chain the wallet origin does not serve: connection must be REFUSED with 4902 and
         the served chains reported (MC-109). -->
    <button type="button" id="connect-unserved">Connect on an unserved chain</button>
    <button type="button" id="disconnect">Disconnect</button>
    <pre id="out" data-testid="out"></pre>
    <script type="module" src="/main.js"></script>
  </body>
</html>
