<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Giano Demo</title>
    <!--
      Runtime config, rendered in the container at start (docker/entrypoint.sh) so one image serves
      every deployment. src/config.ts reads window.__GIANO_CONFIG__ synchronously, so two things about
      this tag are load-bearing:

        * it MUST NOT be `type="module"` — module scripts are deferred, and this has to have run
          before the bundle evaluates;
        * it lives in <head> so that document order says so too.

      In `pnpm dev` and `pnpm preview` this resolves to the null placeholder in public/config.js and
      every value falls back to the GIANO_* variables in .env.development / .env.local.
    -->
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
