version: 2
updates:
  # Workflows pin every third-party action to a full commit SHA, with the release as a trailing
  # comment. Dependabot keeps both up to date. The cooldown matches the 7-day minimum release age
  # that ABIP-6 sets for this project's dependencies.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
      include: scope
