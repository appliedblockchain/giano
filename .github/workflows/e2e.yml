name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The suite runs one test at a time (workers: 1 — one shared backend, stateful wallet popups), so a
  # single runner spends most of the job waiting on tests in series. Each leg below brings up its own
  # stack on its own runner and runs one slice: the main suite in two halves, and the reference-dApp
  # demo on its own. The halves split by whole spec file, so a file's tests (and a `serial` block in
  # it) always share one stack. e2e/ci-shard-1.txt names the first half's files; the second half
  # runs every other file, so a new spec file can never fall outside both. Not `--shard`: it cuts
  # at file boundaries by test count and left one half with 69 of 98 tests. Each leg repeats the
  # ~2 min of setup; the wall clock drops by more.
  playwright:
    name: E2E (${{ matrix.leg.name }})
    runs-on: ubuntu-26.04
    strategy:
      # Let every leg finish: one failing shard should not hide the other's failures.
      fail-fast: false
      matrix:
        leg:
          - { id: main-1, name: 'main 1/2', test: 'pnpm test --test-list ci-shard-1.txt' }
          - { id: main-2, name: 'main 2/2', test: 'pnpm test --test-list-invert ci-shard-1.txt' }
          - { id: demo, name: 'reference demo', test: 'pnpm test:demo' }
    steps:
      # The stack builds wallet-api, wallet-web, paymaster-admin and the bundler from their
      # Dockerfiles, which build on Docker Hardened Images (ABIP-2), and dhi.io refuses anonymous
      # pulls. Without the credential the run FAILS here, as its first step and by name — the suite
      # is never skipped and reported green. That includes fork PRs, which get no secrets. A step
      # rather than a job of its own: a separate job costs a second runner allocation on every run
      # and gains nothing, because this step fails just as early.
      - name: Require Docker Hub credentials for dhi.io
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo '::error::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN must both be set: the e2e stack builds on dhi.io bases and dhi.io refuses anonymous pulls'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # 24, not 22: portless (the local proxy that serves the demo's names) requires it.
          node-version-file: .nvmrc
          cache: pnpm
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Docker's signature on every DHI base the stack builds on, before compose builds anything
      # (scripts/verify-dhi-bases.mjs, as docker.yml does per image).
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Verify the DHI base signatures
        run: |
          node scripts/verify-dhi-bases.mjs \
            services/wallet-api/Dockerfile services/wallet-web/Dockerfile services/paymaster-admin/Dockerfile \
            services/bundler/Dockerfile
      # The same builder docker.yml writes main's layer cache with. The runner's built-in `docker`
      # driver imports that cache but matches none of its RUN steps, so every image rebuilt cold;
      # a docker-container builder computes the same cache keys as the one that wrote them.
      # Compose builds through it and loads each image back into the daemon.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Started in the background so that it builds while the host installs dependencies, builds the
      # packages and installs Chromium — none of which the stack needs. `Wait for the stack` below
      # joins it and fails the job on its exit code, with its full output.
      #
      # Spawned from an action rather than a `run` step: the GitHub Actions cache backend that
      # deploy/docker-compose.e2e.ci.yml reads main's layer cache through authenticates with the
      # runtime token, which the runner hands to actions only. Spawning compose here gives the token
      # to that one process tree. Exporting it to GITHUB_ENV instead would hand it to every later
      # step — pnpm install, the package builds, Playwright — and on a push to main that token can
      # write main's cache scopes, the ones docker.yml builds the published images from.
      #
      # `--wait` blocks on the sponsorship provisioner, which installs each demo tenant's rules
      # through the real admin API and then verifies its own work. A stack that cannot sponsor must
      # fail to come up rather than come up broken and take the failure out on a Playwright test.
      - name: Start stack (background)
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const { spawn } = require('node:child_process');
            const fs = require('node:fs');
            const out = fs.openSync(`${process.env.RUNNER_TEMP}/stack.log`, 'w');
            spawn('bash', ['-c',
              'docker compose -f deploy/docker-compose.e2e.yml -f deploy/docker-compose.e2e.ci.yml ' +
              'up --build -d --wait --wait-timeout 300; echo $? > "$RUNNER_TEMP/stack.exit"'],
              { detached: true, stdio: ['ignore', out, out], env: process.env }).unref();
      - run: pnpm install --frozen-lockfile
      - name: Build packages
        run: |
          pnpm --filter @appliedblockchain/giano-contracts build:ts
          pnpm --filter @appliedblockchain/giano-wallet-core build
          pnpm --filter @appliedblockchain/giano-wallet-transport build
          pnpm --filter @appliedblockchain/giano-tx-describe build
          pnpm --filter @appliedblockchain/giano-wallet-kit build
          pnpm --filter @appliedblockchain/giano-connector build
      - name: Install Playwright browsers
        working-directory: e2e
        run: pnpm exec playwright install --with-deps chromium
      - name: Wait for the stack
        run: |
          # the compose step's own budget is 300s of --wait on top of the build
          for _ in $(seq 1 600); do
            [ -s "$RUNNER_TEMP/stack.exit" ] && break
            sleep 1
          done
          cat "$RUNNER_TEMP/stack.log"
          if [ ! -s "$RUNNER_TEMP/stack.exit" ]; then
            echo '::error::docker compose up did not finish within 10 minutes'
            exit 1
          fi
          code=$(cat "$RUNNER_TEMP/stack.exit")
          [ "$code" = 0 ] || { echo "::error::docker compose up exited $code"; exit "$code"; }
      - name: Start portless proxy
        working-directory: e2e
        run: |
          node portless-setup.mjs --routes-only
          sudo "$(which node)" node_modules/portless/dist/cli.js proxy start --no-tls
          node node_modules/portless/dist/cli.js doctor
      - name: Wait for services
        run: |
          # Poll each endpoint on its own. config.json is a static file served the moment
          # nginx boots, so waiting on it alone proves nothing about wallet-api readiness.
          wait_for() {
            local label="$1"; shift
            for i in $(seq 1 60); do
              "$@" > /dev/null 2>&1 && return 0
              sleep 2
            done
            echo "timed out waiting for $label"
            "$@" || true
            return 1
          }
          # Through portless, by name: this is the path the browser takes, so it also proves
          # the proxy is routing and that /etc/hosts resolution is in place.
          wait_for 'wallet-web config.json' curl -fsS http://wallet.localhost/config.json
          wait_for 'wallet-api /api/healthz' curl -fsS http://wallet.localhost/api/healthz
          # tenant resolution sanity: both tenants resolvable by Host on the raw API port
          # (catches Host-normalization breakage before spending Playwright time). Deliberately
          # NOT through portless — portless routes *by* Host, so a spoofed Host is exactly what
          # it cannot forward. The published container port is the only way to probe this.
          wait_for 'tenant stock' curl -fsS -H 'Host: wallet.localhost' http://127.0.0.1:8080/.well-known/webauthn
          wait_for 'tenant byo' curl -fsS -H 'Host: wallet-byo.localhost' http://127.0.0.1:8080/.well-known/webauthn
          # A deployment whose signer is unreachable cannot sponsor, and sponsored tenants cannot
          # transact at all without it — so /readyz reporting sponsorship as 'ok' is a precondition
          # for the suite, not an observation from it.
          wait_for 'sponsorship ready' bash -c "curl -fsS http://api.localhost/readyz | grep -q '\"sponsorship\":\"ok\"'"
          curl -fsS http://wallet.localhost/config.json
          curl -fsS http://api.localhost/readyz
      - name: Install the reference dApp
        if: matrix.leg.id == 'demo'
        # Its own pnpm workspace: it installs the published connector from GitHub Packages, which
        # refuses anonymous reads.
        working-directory: services/custom-example
        run: |
          echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" >> "$HOME/.npmrc"
          pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # `list`, not CI's default `dot`: it prints each test's duration, so a slow test shows in the log.
      - name: Run E2E (${{ matrix.leg.name }})
        working-directory: e2e
        run: ${{ matrix.leg.test }} --reporter=list
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces-${{ matrix.leg.id }}
          path: e2e/test-results
      - name: portless state on failure
        if: failure()
        working-directory: e2e
        run: |
          node node_modules/portless/dist/cli.js list || true
          node node_modules/portless/dist/cli.js doctor || true
      - name: Stack logs on failure
        if: failure()
        run: |
          # The compose build output; `Wait for the stack` prints it only when every step before it passed.
          cat "$RUNNER_TEMP/stack.log" || true
          docker compose -f deploy/docker-compose.e2e.yml logs wallet-api --tail 200
          docker compose -f deploy/docker-compose.e2e.yml logs sponsorship-provisioner --tail 100
          docker compose -f deploy/docker-compose.e2e.yml logs tx-mapping-provisioner --tail 100
          docker compose -f deploy/docker-compose.e2e.yml logs --tail 200
      # A sponsorship failure is usually an accounting failure, and the numbers are the diagnosis.
      # Collecting them here means a CI failure is explicable without reproducing it locally.
      - name: Sponsorship state on failure
        if: failure()
        run: |
          echo '--- accounting metrics ---'
          curl -fsS http://api.localhost/metrics | grep -E '^giano_(sponsorship|paymaster|tenant)' || true
          for key in e2e-admin-key-stock e2e-admin-key-byo00; do
            echo "--- $key balance ---"
            curl -fsS -H "Authorization: Bearer $key" http://api.localhost/v1/admin/sponsorship/balance || true
            echo "--- $key recent decisions ---"
            curl -fsS -H "Authorization: Bearer $key" 'http://api.localhost/v1/admin/sponsorship/decisions?limit=20' || true
          done

  # The single check that branch rules and reviewers look at, under the name the job had before it
  # was split. It passes only when every leg above passed; a skipped or cancelled leg fails it.
  result:
    name: Two-tenant Playwright suite (Chromium + virtual authenticator)
    needs: playwright
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Every leg passed
        env:
          RESULT: ${{ needs.playwright.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "::error::the E2E legs finished with '$RESULT'"
            exit 1
          fi
