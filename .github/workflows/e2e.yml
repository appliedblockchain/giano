name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Two-origin Playwright suite (Chromium + virtual authenticator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build packages
        run: |
          pnpm --filter @appliedblockchain/giano-contracts build:ts
          pnpm --filter @appliedblockchain/giano-wallet-core build
          pnpm --filter @appliedblockchain/giano-wallet-transport build
          pnpm --filter @appliedblockchain/giano-connector build
      - name: Start stack
        run: docker compose -f deploy/docker-compose.e2e.yml up --build -d
      - name: Wait for services
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8081/config.json > /dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:8081/config.json
          curl -fsS http://localhost:8081/api/healthz
      - name: Install Playwright browsers
        working-directory: e2e
        run: pnpm exec playwright install --with-deps chromium
      - name: Run E2E
        working-directory: e2e
        run: pnpm test
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: e2e/test-results
      - name: Stack logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.e2e.yml logs --tail 200
