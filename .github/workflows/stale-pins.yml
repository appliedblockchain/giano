name: Stale pins

# openspec: dependency-freshness. Replaces Dependabot version updates; ported from the toolbox's
# weekly freshness run. Every Monday, scripts/check-stale-pins.mjs compares each pin (exact npm
# versions in both workspaces, SHA-pinned actions, Node, pnpm, Foundry and the CI tools pinned
# outside npm) with its newest stable release that is at least 7 days old (ABIP-6). The report keeps
# one open issue labelled `stale-pins` up to date, and closes it once every pin is current or held
# by a row in docs/version-deferrals.md. Upgrades are made by hand, one PR each (AGENTS.md). It is
# not part of the PR gate, so a new upstream release never blocks an unrelated PR.

on:
  schedule:
    # Mondays 07:00 UTC, an hour after the weekly security scan.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: stale-pins
  cancel-in-progress: false

jobs:
  report:
    name: Check pins and report in the tracking issue
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      # Open, edit and close the tracking issue, and create its label.
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Exit 1 means a stale pin, a failed lookup or a broken deferral row: all go in the issue.
      # Any other exit, or no report, fails the job rather than closing the issue.
      - name: Check every pin
        id: check
        env:
          # The GitHub API rate limit for unauthenticated requests is too low for every action.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          node scripts/check-stale-pins.mjs > stale-pins.md
          status=$?
          set -e
          cat stale-pins.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -gt 1 ] || [ ! -s stale-pins.md ]; then
            echo "::error::the stale-pins check did not finish (exit $status)"
            exit 1
          fi
          echo "stale=$status" >> "$GITHUB_OUTPUT"
      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STALE: ${{ steps.check.outputs.stale }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          issue=$(gh issue list --label stale-pins --state open --json number --jq '.[0].number // empty')
          if [ "$STALE" = 1 ]; then
            # An issue body holds at most 65536 characters.
            { head -c 60000 stale-pins.md; echo; echo; echo "_Updated by the [stale-pins run]($RUN_URL)._"; } > body.md
            gh label create stale-pins --color FBCA04 \
              --description "Pins behind their latest qualifying release (stale-pins.yml)" --force
            if [ -n "$issue" ]; then
              gh issue edit "$issue" --body-file body.md
              echo "Updated issue #$issue."
            else
              gh issue create --title "Stale pins" --label stale-pins --body-file body.md
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" \
              --comment "Every pin is current or held by a deferral. $RUN_URL"
          else
            echo "Every pin is current, and no tracking issue is open."
          fi
