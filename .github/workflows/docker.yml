name: Docker images

# Every image builds on every PR; only main and tags push. A PR build is the only thing that
# exercises giano-bundler, giano-devnet, giano-contracts-deployer, giano-example and
# giano-wallet-byo at all — the e2e compose stack builds just wallet-api, wallet-web and
# paymaster-admin, uses upstream images for the rest, and runs the demo dApp and the BYO
# wallet host-side from source rather than as images — so without this a broken Dockerfile
# first surfaces in the job that publishes it.
#
# Every build is scanned with Trivy before anything is pushed (G25, openspec: ci-security-gates,
# design D10). A HIGH or CRITICAL vulnerability with a fix that security/accepted-findings.json
# does not accept fails the build job, on PRs too, so nothing is pushed, tagged or signed.
#
# Each arch builds on its own NATIVE runner and is pushed by digest; a merge job then joins
# the two digests into one manifest list. The previous shape — one job, both platforms, arm64
# under QEMU via setup-qemu-action — cost roughly 8x on the emulated leg (wallet-web:
# `pnpm install` 17.7s amd64 vs 107s arm64, the workspace build 49.6s vs 404.2s) and, worse,
# `pnpm install` under emulation intermittently deadlocked outright, burning the full 6h job
# timeout on a random image per run. Native arm64 runners are free for public repositories.
#
# Two registries, one build. GHCR is how Giano is DISTRIBUTED to client projects; ECR is how
# the dev DEPLOYMENT is fed (specs/INFRASTRUCTURE.md §11, §15, §16.2). The per-arch digests
# are pushed to GHCR only; the merge job assembles the list there and then copies that exact
# list into ECR by digest, so the bytes in ECR are the ones that were validated and published
# to GHCR — not a rebuild that happens to come from the same commit.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # AWS OIDC for the ECR push. Required at the workflow level for the job to receive a token
  # at all; the role's own `sub` condition is what actually restricts who may use it.
  id-token: write

# Not secrets: every value here is in specs/INFRASTRUCTURE.md (§10.5, §11). Kept together so
# that pointing this workflow at another environment is a two-line change — the ECR namespace
# carries the environment (`giano-dev/wallet-api`) precisely so dev and prd cannot collide.
env:
  ECR_REGISTRY: 379937780633.dkr.ecr.eu-west-2.amazonaws.com
  ECR_NAMESPACE: giano-dev
  AWS_REGION: eu-west-2
  AWS_ROLE_ARN: arn:aws:iam::379937780633:role/giano-dev-gha-deploy
  GHCR_NAMESPACE: ghcr.io/appliedblockchain

concurrency:
  group: docker-${{ github.ref }}
  # superseded PR builds are cancelled; a push that may be mid-publish is never cancelled
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The image list lives here and nowhere else. `build` fans it out across two arches and
  # `merge` walks it once, so holding it in either matrix directly would mean two copies that
  # drift the first time an image is added.
  setup:
    name: Enumerate images
    runs-on: ubuntu-26.04
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      # Every image builds on a Docker Hardened Image (ABIP-2, docs/abip-compliance.md), and dhi.io
      # refuses anonymous pulls. Without the credential the run FAILS here, up front and by name, never
      # skipping the build and reporting green. That includes fork PRs, which get no secrets.
      - name: Require Docker Hub credentials for dhi.io
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo '::error::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN must both be set: every image builds on a dhi.io base and dhi.io refuses anonymous pulls'
            exit 1
          fi
      - id: list
        # `ecr` is the repository under ${ECR_NAMESPACE}, or '' for an image this deployment
        # does not run. Six repositories, deliberately not eight — infra/iac/ecr.vars.tf.
        # Empty rather than absent: an unset key compares equal to '' only through GitHub's
        # null-to-number coercion, which is not a rule to rest a publish decision on.
        #
        # giano-example is the demo dApp: ONE image runs twice in the deployment — as
        # custom-example and custom-example-byoui, differing only in GIANO_WALLET_URL and
        # GIANO_APP_LABEL — which is why infra/iac has six ECR repositories for seven
        # services. giano-wallet-byo is tenant `byoui`'s wallet origin, the reference SPA a
        # real BYO tenant copies; it lives under e2e/ because it is also the e2e fixture, and
        # it is the only published image Giano would not run in a real deployment — a real
        # BYO tenant hosts its own UI, so it is deployed in dev only (infra/iac
        # var.byo_wallet_enabled). giano-devnet and giano-contracts-deployer are GHCR only:
        # neither is deployed to AWS, so neither has an ECR repository (§11).
        run: |
          cat > images.json <<'JSON'
          [
            { "name": "giano-wallet-api",
              "dockerfile": "services/wallet-api/Dockerfile",
              "ecr": "wallet-api" },
            { "name": "giano-wallet-web",
              "dockerfile": "services/wallet-web/Dockerfile",
              "ecr": "wallet-web" },
            { "name": "giano-paymaster-admin",
              "dockerfile": "services/paymaster-admin/Dockerfile",
              "ecr": "paymaster-admin" },
            { "name": "giano-example",
              "dockerfile": "services/custom-example/Dockerfile",
              "ecr": "example" },
            { "name": "giano-wallet-byo",
              "dockerfile": "e2e/wallet-byo/Dockerfile",
              "ecr": "wallet-byo" },
            { "name": "giano-bundler",
              "dockerfile": "services/bundler/Dockerfile",
              "ecr": "bundler" },
            { "name": "giano-devnet",
              "dockerfile": "services/devnet/Dockerfile",
              "ecr": "" },
            { "name": "giano-contracts-deployer",
              "dockerfile": "packages/contracts/Dockerfile.deployer",
              "ecr": "" }
          ]
          JSON
          jq -e . images.json > /dev/null
          echo "images=$(jq -c . images.json)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.image.name }} (${{ matrix.platform.arch }})
    needs: setup
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.setup.outputs.images) }}
        # Native runners on both legs — no setup-qemu-action, no binfmt, no emulation. arm64
        # is the arch that actually gets deployed (ECS runs ARM64: infra/iac ecs-service.tf,
        # ecs_tasks_oneshot.tf), so it stays on every event, PRs included.
        # Runner images are pinned (never `ubuntu-latest`) so both legs share one OS release
        # and a label move (actions/runner-images#14748) can't change the build underneath us.
        platform:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    env:
      # G25 (openspec: ci-security-gates, design D10, D11). Trivy v0.76.1, released 2026-10-21:
      # an exact version at least 7 days old, checked against these sha256 values before it
      # runs (docs/abip-compliance.md, "Tools installed outside npm"). The names avoid the
      # TRIVY_ prefix, which Trivy reads as its own settings.
      SCAN_TRIVY_VERSION: 0.76.1
      SCAN_TRIVY_SHA256_AMD64: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
      SCAN_TRIVY_SHA256_ARM64: e174dff2a6dba5e3ae41f8d0537a6324405bd08132497340304c6b20e0f16a1f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        # no registry credentials on PRs — nothing is pushed, and a fork PR has none
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Pull access to the hardened bases, on every event: a PR build pulls them too.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Docker's signature on every DHI base the Dockerfile pins, checked before a layer is built
      # (scripts/verify-dhi-bases.mjs; the ABIP-2 migration guide requires it). Same parser as the
      # policy check, so what is verified is exactly what is pinned.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Verify the DHI base signatures
        run: node scripts/verify-dhi-bases.mjs '${{ matrix.image.dockerfile }}'

      # --- Scan before publishing (G25, design D10) -------------------------------------------
      # The image is built once to a tar and scanned. Only an image that passes the scan reaches
      # the push below; on a PR nothing is pushed at all. A binary with a known hash runs here,
      # not a third-party action, because this job holds `packages: write` and `id-token: write`.
      - name: Install Trivy
        env:
          ARCH: ${{ matrix.platform.arch }}
        run: |
          case "$ARCH" in
            amd64) asset=Linux-64bit; sha="$SCAN_TRIVY_SHA256_AMD64" ;;
            arm64) asset=Linux-ARM64; sha="$SCAN_TRIVY_SHA256_ARM64" ;;
            *) echo "::error::no Trivy binary for $ARCH"; exit 1 ;;
          esac
          # Outside the workspace: the workspace is the build context.
          cd "$RUNNER_TEMP"
          curl -fsSL -o trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${SCAN_TRIVY_VERSION}/trivy_${SCAN_TRIVY_VERSION}_${asset}.tar.gz"
          echo "$sha  trivy.tar.gz" | sha256sum -c -
          mkdir trivy trivy-run
          tar -xzf trivy.tar.gz -C trivy trivy
          echo "$RUNNER_TEMP/trivy" >> "$GITHUB_PATH"

      # The same build as the push below, to a tar: same Dockerfile, platform, secret and cache.
      # No SBOM or provenance: they are attestations, not image layers, and the push adds them.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        name: Build the image for the scan
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/${{ matrix.platform.arch }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          provenance: false
          sbom: false
          # Read access to GitHub Packages for the images that install a published Giano package
          # (giano-example's connector). A Dockerfile that never mounts it ignores it.
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}

      # Every finding goes into the report: no severity filter, no --ignore-unfixed, no ignore
      # file and no config file (both set to "", and the step runs in an empty directory).
      # scripts/check-accepted-findings.mjs decides: it fails on a HIGH or CRITICAL finding with
      # a fix that no register entry accepts, and on a report with no OS or an end-of-life OS.
      # A failed database download fails the step; it never skips the scan.
      - name: Scan the image (Trivy)
        working-directory: ${{ runner.temp }}/trivy-run
        env:
          IMAGE: ${{ matrix.image.name }}
          ARCH: ${{ matrix.platform.arch }}
        run: |
          if env | grep -q '^TRIVY_'; then
            echo "::error::a TRIVY_ environment variable is set; it would change the scan"
            exit 1
          fi
          trivy image --input "$RUNNER_TEMP/image.tar" \
            --config "" --ignorefile "" \
            --scanners vuln --pkg-types os,library \
            --db-repository mirror.gcr.io/aquasec/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2 \
            --java-db-repository mirror.gcr.io/aquasec/trivy-java-db:1,public.ecr.aws/aquasecurity/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1 \
            --cache-dir "$RUNNER_TEMP/trivy-cache" --skip-version-check --no-progress \
            --format json --output "$RUNNER_TEMP/trivy-$IMAGE-$ARCH.json"
      - name: Vulnerabilities are fixed or accepted
        env:
          IMAGE: ${{ matrix.image.name }}
          ARCH: ${{ matrix.platform.arch }}
        run: |
          node scripts/check-accepted-findings.mjs --tool trivy --image "$IMAGE" \
            --report "$RUNNER_TEMP/trivy-$IMAGE-$ARCH.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: trivy-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/trivy-${{ matrix.image.name }}-${{ matrix.platform.arch }}.json
          if-no-files-found: ignore
          retention-days: 14

      # --- Publish (not on PRs) ---------------------------------------------------------------
      # The builder still holds every layer from the scan build, so this step rebuilds nothing.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        if: github.event_name != 'pull_request'
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/${{ matrix.platform.arch }}
          # Pushed by digest under no tag at all; `merge` is what attaches tags.
          outputs: type=image,name=${{ env.GHCR_NAMESPACE }}/${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true
          # SBOM and minimal provenance on every published image (ABIP-2). Each adds an
          # attestation manifest to the per-arch index; `merge` carries them into the list and
          # ECR receives the same list, so the bytes stay identical in both registries. ECR's
          # lifecycle policy expires on `tagStatus: any`, so these spend retention budget:
          # about six ECR images per commit now, against three before, while
          # var.ecr_lifecycle_image_count.dev (infra/iac/ecr.vars.tf) is 120 — about twenty
          # commits of retention. At 10 it was under two, and the pinned dev tag expired.
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          provenance: mode=min
          sbom: true
          # Scoped per image AND per arch. The default scope is shared by every build in the
          # repository, so sixteen jobs would evict each other's layers on every run and each
          # would then read back a cache written by a different image.
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          # Only main, tags and manual runs write the cache: PRs never reach this step. Branch
          # cache entries are invisible to main and would only evict it from the shared 10GB budget.
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}

      # The pushed layers must be the scanned layers. If the push step rebuilt a layer (a cache
      # miss on a build that is not reproducible), the layers differ and the job fails here. The
      # digest is then in GHCR without a tag, but `merge` needs every build job, so nothing is
      # tagged, copied to ECR or signed.
      - name: Confirm the pushed image is the scanned image
        if: github.event_name != 'pull_request'
        env:
          REF: ${{ env.GHCR_NAMESPACE }}/${{ matrix.image.name }}@${{ steps.build.outputs.digest }}
          PLATFORM: linux/${{ matrix.platform.arch }}
        run: |
          set -o pipefail
          config=$(tar -xOf "$RUNNER_TEMP/image.tar" manifest.json | jq -er '.[0].Config')
          scanned=$(tar -xOf "$RUNNER_TEMP/image.tar" "$config" \
            | jq -ce '.rootfs.diff_ids | select(length > 0)')
          # One platform per index, so .Image is the image itself; a map by platform is read too.
          pushed=$(docker buildx imagetools inspect "$REF" --format '{{json .Image}}' \
            | jq -ce --arg p "$PLATFORM" \
                'if has("rootfs") then .rootfs.diff_ids else .[$p].rootfs.diff_ids end | select(length > 0)')
          echo "scanned: $scanned"
          echo "pushed:  $pushed"
          if [ "$scanned" != "$pushed" ]; then
            echo "::error::the pushed image $REF has other layers than the scanned image"
            exit 1
          fi

      # The digest is the only thing `merge` needs, and an empty file named for it is the
      # smallest artifact that carries one. Two arches upload two artifacts per image; merge
      # collects them back by name pattern.
      - name: Export the digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name != 'pull_request'
        with:
          name: digest-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish ${{ matrix.image.name }}
    needs: [setup, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.setup.outputs.images) }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.image.name }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.GHCR_NAMESPACE }}/${{ matrix.image.name }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      # One manifest list per image, assembled from the two per-arch digests.
      - name: Create the manifest list on GHCR
        id: ghcr
        working-directory: /tmp/digests
        run: |
          image="$GHCR_NAMESPACE/${{ matrix.image.name }}"
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$image@sha256:%s " *)
          # Resolve the list's own digest through a tag that cannot move: `latest` is
          # rewritten by every main build, so reading it back would race a concurrent run.
          # The type=sha tag is unique to this commit — taken from metadata-action's own
          # output rather than rebuilt from $GITHUB_SHA, so the short-sha length stays the
          # action's business and not a constant duplicated here.
          ref=$(jq -r '[.tags[] | select(contains(":sha-"))] + .tags | first' \
                  <<< "$DOCKER_METADATA_OUTPUT_JSON")
          list=$(docker buildx imagetools inspect "$ref" \
                   --format '{{json .Manifest}}' | jq -r .digest)
          echo "resolved $ref -> $list"
          echo "digest=$list" >> "$GITHUB_OUTPUT"

      # Keyless Sigstore signature on the published list, bound to this workflow's GitHub OIDC
      # identity (id-token: write, above). Signed by digest, so it covers exactly what was built.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.3
      - name: Sign the GHCR manifest list
        run: |
          image="$GHCR_NAMESPACE/${{ matrix.image.name }}@${{ steps.ghcr.outputs.digest }}"
          cosign sign --yes "$image"
          cosign verify "$image" \
            --certificate-identity-regexp '^https://github\.com/appliedblockchain/giano/\.github/workflows/docker\.yml@' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null

      # --- ECR ------------------------------------------------------------------------
      # Gated on the REF, not the event. `giano-dev-gha-deploy` trusts
      # `repo:appliedblockchain/giano:ref:refs/heads/main` and nothing else
      # (infra/iac/github_oidc.vars.tf gha_allowed_refs), so a pull_request
      # (refs/pull/N/merge) and a v* tag push (refs/tags/v*) are both denied by the role
      # itself. Skipping them here is what keeps a release tag green: it still publishes to
      # GHCR, which is where a tagged release belongs.
      #
      # The ECR steps below chain off `steps.aws.outcome` rather than restating the condition
      # — a skipped step's outcome is 'skipped', never 'success'.
      - name: Assume the deploy role
        id: aws
        if: matrix.image.ecr != '' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Log in to ECR
        if: steps.aws.outcome == 'success'
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - name: Skip the ECR tag if this commit is already published
        id: ecr
        if: steps.aws.outcome == 'success'
        # The repositories are IMMUTABLE (infra/iac/ecr.vars.tf), so re-running a green build
        # at the same commit would fail on PutImage with ImageAlreadyExistsException — every
        # "Re-run failed jobs" on a published commit would be red. Dropping just the ECR tag
        # keeps the build itself, and the mutable GHCR push, exactly as they were.
        run: |
          repo="$ECR_NAMESPACE/${{ matrix.image.ecr }}"
          if aws ecr describe-images \
              --repository-name "$repo" \
              --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "::notice::$repo:$GITHUB_SHA already published — ECR tag skipped"
            echo 'push=false' >> "$GITHUB_OUTPUT"
          else
            echo 'push=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Copy the manifest list to ECR
        if: steps.ecr.outputs.push == 'true'
        # The full commit SHA and nothing else. `latest` is not repushable to an IMMUTABLE
        # repository, and the tag is consumed verbatim — `terraform apply -var
        # image_tag=<sha>` (infra/iac/ecs_services.vars.tf) — so it is the 40-character
        # $GITHUB_SHA, not metadata-action's default `sha-<short>`.
        #
        # The source is the GHCR list BY DIGEST, so this re-tags the manifest that was just
        # published rather than rebuilding it: the same digest lands in both registries by
        # construction, which is what the old single-build-two-tag-sets shape guaranteed.
        run: |
          docker buildx imagetools create \
            --tag "$ECR_REGISTRY/$ECR_NAMESPACE/${{ matrix.image.ecr }}:$GITHUB_SHA" \
            "$GHCR_NAMESPACE/${{ matrix.image.name }}@${{ steps.ghcr.outputs.digest }}"
      # The same digest, signed by the same workflow identity, so a consumer of the ECR copy
      # verifies it exactly as they would the GHCR one.
      - name: Sign the ECR copy
        if: steps.ecr.outputs.push == 'true'
        run: |
          image="$ECR_REGISTRY/$ECR_NAMESPACE/${{ matrix.image.ecr }}@${{ steps.ghcr.outputs.digest }}"
          cosign sign --yes "$image"
          cosign verify "$image" \
            --certificate-identity-regexp '^https://github\.com/appliedblockchain/giano/\.github/workflows/docker\.yml@' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
