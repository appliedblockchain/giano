name: Terraform

# The ROLLOUT half of delivery. `docker.yml` builds and publishes images on every
# push to main; this workflow deploys one, and the two are deliberately not the
# same pipeline because they answer to different triggers:
#
#   merge app code      → docker.yml publishes ghcr + ecr images tagged <sha>
#   merge a tag bump    → this workflow applies it
#
# The version deployed is DECLARED, in `var.image_tag` (infra/iac/ecs_services.vars.tf),
# not inferred from what is newest. Deploying is a one-line reviewed diff to that map.
# specs/INFRASTRUCTURE.md §15.
#
# Terraform owns every task definition, which is why the rollout is an `apply` and not
# `aws-actions/amazon-ecs-deploy-task-definition`. A RegisterTaskDefinition from CI
# publishes a revision the next apply reverts — two writers, one resource (§15).
on:
  pull_request:
    paths: ['infra/iac/**', '.github/workflows/terraform.yml']
  push:
    branches: [main]
    paths: ['infra/iac/**', '.github/workflows/terraform.yml']
  workflow_dispatch:

permissions:
  contents: read
  # AWS OIDC. The role's own `sub` condition restricts who may actually use it.
  id-token: write

concurrency:
  # NOT cancel-in-progress: an apply cancelled between RegisterTaskDefinition and
  # UpdateService leaves the state lock held and the services half-rolled.
  group: terraform-dev
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2
  AWS_ROLE_ARN: arn:aws:iam::379937780633:role/gianotest-dev-gha-terraform
  # The workspace IS the environment (§4.1). It must already exist — bring-up
  # created it (§18 step 5); `init` selects it, it does not create it.
  TF_WORKSPACE: dev
  TF_IN_AUTOMATION: 'true'

jobs:
  terraform:
    name: ${{ github.event_name == 'push' && 'Apply' || 'Plan' }} (dev)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/iac
    steps:
      - uses: actions/checkout@v7

      # `data "external" "secret_inventory"` shells out to `op` at PLAN time to read
      # the secret names and versions (§12.4) — so the CLI is a hard dependency of
      # `plan`, not just of `apply`. `jq` is preinstalled on ubuntu-latest.
      - uses: 1password/install-cli-action@v1

      - name: Assume the Terraform role
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # `_init.tf` configures the AWS provider with `profile = var.profile[workspace]`
      # ("default"), and an explicitly named profile is resolved from the shared config
      # files — which do not exist on a runner — rather than from the credentials
      # configure-aws-credentials just put in the environment. Writing them into a
      # `[default]` profile satisfies both without touching the module, whose §4.6
      # promise is that an operator's shell needs nothing set.
      - name: Materialise the assumed role as the `default` profile
        run: |
          aws configure set region "$AWS_REGION" --profile default
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID" --profile default
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY" --profile default
          aws configure set aws_session_token "$AWS_SESSION_TOKEN" --profile default

      - uses: hashicorp/setup-terraform@v3
        with:
          # >= 1.11 for write-only arguments (§12.1). Pinned, not floating: a
          # provider or core upgrade should be a reviewed diff like any other.
          terraform_version: 1.11.4
          # the wrapper rewrites stdout, which breaks `-detailed-exitcode` handling
          terraform_wrapper: false

      - run: terraform init -input=false

      - run: terraform fmt -check -recursive
      - run: terraform validate

      # `op_account` and OP_SERVICE_ACCOUNT_TOKEN are mutually exclusive — the
      # 1Password provider picks one, and the failure when both are set is a
      # confusing auth error (_init.tf). Empty here, so the token is the only
      # credential in play; asm.tf drops the `--account` flag to match.
      #
      # `ecs_wait_for_steady_state` is what makes a failed rollout a failed
      # workflow: without it the apply returns as soon as ECS accepts the new
      # task definition, and a container that crash-loops (or a `migrate` init
      # container that exits non-zero, §9.6) is green here and broken in Datadog.
      #
      # These two are the only `-var` flags. Every other setting is a
      # workspace-keyed map with a default in a `.vars.tf` (§4.1, §4.6).
      - name: Plan
        id: plan
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          terraform plan -input=false -out=dev.tfplan \
            -var 'op_account=' \
            -var 'ecs_wait_for_steady_state=true'

      # Applying the SAVED plan, not re-planning: the apply is provably the change
      # that was reviewed, and Terraform refuses a stale plan rather than widening it.
      - name: Apply
        if: github.event_name == 'push'
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: terraform apply -input=false dev.tfplan

      - name: Summarise
        if: always() && steps.plan.outcome == 'success'
        run: |
          {
            echo '### Terraform (dev)'
            echo
            echo '```'
            terraform show -no-color dev.tfplan | head -300
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
