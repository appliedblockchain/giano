name: CI

on:
  pull_request:
  workflow_call:

# Without this a called workflow inherits the CALLER's token — every job here would then run
# with release.yml's `packages: write`. Nothing below needs more than read: no step reads a
# secret, all six git submodules are public, and setup-node's pnpm cache authenticates with
# ACTIONS_RUNTIME_TOKEN rather than GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # The `github` context inside a called workflow is the caller's, so this is `push` when CI
  # runs as the release gate and `pull_request` when it runs standalone: a merge's gate run is
  # never cancelled out from under the publish that needs it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  packages:
    name: Build & typecheck packages (no solc)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # deliberately NO submodules: proves a fresh clone builds the TS surface.
          # Full history so `origin/<base>` exists for `changeset status --since`.
          fetch-depth: 0
      # anvil for the wallet-core SignatureWrapper wire-format test, which runs the SDK against the
      # released contract. The test is skipped without anvil locally, but fails without it in CI.
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.7.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint and format check (Biome)
        # Read-only: fails on any formatting difference or lint error. `pnpm format` fixes both
        # locally. services/custom-example has its own config and is checked by its own build.
        run: pnpm exec biome ci .
      - name: Test profile-driven deployment gates
        run: pnpm --filter @appliedblockchain/giano-contracts test:deploy
      - name: Build contracts TS surface (committed artifacts only)
        run: pnpm --filter @appliedblockchain/giano-contracts build:ts
      - name: Build wallet-core
        run: pnpm --filter @appliedblockchain/giano-wallet-core build
      - name: wallet-core unit tests
        run: pnpm --filter @appliedblockchain/giano-wallet-core test
      - name: Build wallet-transport
        # connector's tests and the typecheck below resolve this via its dist/ types
        run: pnpm --filter @appliedblockchain/giano-wallet-transport build
      - name: wallet-transport unit tests
        run: pnpm --filter @appliedblockchain/giano-wallet-transport test
      - name: Build connector
        run: pnpm --filter @appliedblockchain/giano-connector build
      - name: Build tx-describe
        # wallet-kit's tests and the typecheck below resolve this via its dist/ types
        run: pnpm --filter @appliedblockchain/giano-tx-describe build
      - name: tx-describe unit tests (incl. the R1 independence check)
        run: pnpm --filter @appliedblockchain/giano-tx-describe test
      - name: Build wallet-kit
        # wallet-web and the BYO reference both build on it (WK-30/WK-31)
        run: pnpm --filter @appliedblockchain/giano-wallet-kit build
      - name: wallet-kit unit tests (the load-bearing invariants, WK-27/WK-28)
        run: pnpm --filter @appliedblockchain/giano-wallet-kit test
      - name: Build paymaster-sdk
        # paymaster-admin's typecheck resolves this via its dist/ types — must precede it
        run: pnpm --filter @appliedblockchain/giano-paymaster-sdk build
      - name: paymaster-sdk unit tests
        run: pnpm --filter @appliedblockchain/giano-paymaster-sdk test
      - name: Build paymaster-admin
        run: pnpm --filter @appliedblockchain/giano-paymaster-admin build
      - name: paymaster-admin unit tests
        # Some import @appliedblockchain/giano-contracts, so after its build:ts step above.
        run: pnpm --filter @appliedblockchain/giano-paymaster-admin test
      - name: Typecheck every package and service (TypeScript 7)
        # After the builds: dependants resolve each other's dist/ types. GNU time prints wall time
        # and peak RSS ("Maximum resident set size") so regressions show up in the log.
        run: /usr/bin/time -v pnpm typecheck
      - name: addresses.ts drift check
        run: |
          pnpm --filter @appliedblockchain/giano-contracts gen:addresses
          git diff --exit-code packages/contracts/addresses.ts

      - name: Changesets config is valid
        # The step below exits early when packages/ is untouched, and `changeset publish` is the
        # next thing to read the config, so without this a bad `ignore` or `fixed` entry (one
        # naming a package that is not in the workspace) first fails the Release job after merge.
        run: |
          node -e "
            const from = { paths: [require.resolve('@changesets/cli/package.json')] };
            const { read } = require(require.resolve('@changesets/config', from));
            const { getPackages } = require(require.resolve('@manypkg/get-packages', from));
            getPackages(process.cwd())
              .then((packages) => read(process.cwd(), packages))
              .then(() => console.log('changesets config ok'))
              .catch((error) => { console.error(error.message); process.exit(1); });
          "
      - name: A change to a publishable package carries a changeset
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # A release PR touches only package.json and CHANGELOG.md under packages/ — its whole job
          # is to CONSUME changesets, so requiring one of it would make it unmergeable under the
          # required status checks on main.
          if git diff --quiet "origin/$BASE_REF...HEAD" -- packages/ \
               ':(exclude)packages/*/package.json' ':(exclude)packages/*/CHANGELOG.md'; then
            echo "no publishable source touched — no changeset required"
            exit 0
          fi
          pnpm changeset status --since="origin/$BASE_REF"

  dockerfile-policy:
    # ABIP-2 (docs/abip-compliance.md): every published image on a digest-pinned Docker Hardened
    # Image, -dev only in non-final stages, no RUN or USER in a final stage. Reads Dockerfiles and
    # docker.yml only — no registry access, no secrets — so it runs on fork PRs as well.
    name: Dockerfile policy (ABIP-2)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Policy check unit tests
        run: node --test scripts/check-dockerfiles.test.mjs
      - name: Check every published Dockerfile
        run: node scripts/check-dockerfiles.mjs

  release-age-policy:
    # ABIP-6 (docs/abip-compliance.md): both pnpm workspaces reject versions younger than 7 days,
    # exclude only exact versions, and every CI and Dockerfile install is frozen. --registry also
    # fails on an exclusion that has outlived the window; with no exclusions it fetches nothing.
    name: Release-age policy (ABIP-6)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Policy check unit tests
        run: node --test scripts/check-release-age.test.mjs
      - name: Check both workspaces, every workflow and Dockerfile
        run: node scripts/check-release-age.mjs --registry

  pinned-versions:
    # ABIP-7 (docs/abip-compliance.md): every dependency in every package.json is an exact version,
    # except peerDependencies of the libraries this repo publishes; override values are exact too.
    # Reads manifests and workspace files only, so it runs on fork PRs as well.
    name: Exact dependency pins (ABIP-7)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Pin check unit tests
        run: node --test scripts/check-pinned-versions.test.mjs
      - name: Check every manifest and override
        run: node scripts/check-pinned-versions.mjs

  accepted-findings:
    # G25 (openspec: ci-security-gates): every finding a security check accepts is in
    # security/accepted-findings.json with a reason, one owner and an expiry date. Fails on a bad or
    # expired entry, a tool-config suppression without an entry, or an in-source Solidity
    # suppression. Reads the repository only, so it runs on fork PRs as well.
    name: Accepted-findings register
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Register check unit tests
        run: node --test scripts/check-accepted-findings.test.mjs
      - name: Check the register, the tool configs and the contract sources
        run: node scripts/check-accepted-findings.mjs

  wallet-api:
    name: wallet-api tests + OpenAPI drift
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build contracts TS surface
        run: pnpm --filter @appliedblockchain/giano-contracts build:ts
      - name: Build tx-describe (mapping validation)
        run: pnpm --filter @appliedblockchain/giano-tx-describe build
      - name: Typecheck
        run: pnpm --filter @appliedblockchain/giano-wallet-api typecheck
      - name: Vitest (unit + testcontainers integration)
        run: pnpm --filter @appliedblockchain/giano-wallet-api test
      - name: OpenAPI drift check
        run: pnpm --filter @appliedblockchain/giano-wallet-api openapi:check

  bundler:
    name: giano-bundler tests (anvil) + chain document
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # anvil for the integration suite, at the version the repo pins everywhere else.
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.7.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build contracts TS surface (the chain document schema)
        run: pnpm --filter @appliedblockchain/giano-contracts build:ts
      - name: Typecheck
        run: pnpm --filter @appliedblockchain/giano-bundler typecheck
      - name: Vitest (unit + anvil integration, incl. the simulation bytecode drift check)
        run: pnpm --filter @appliedblockchain/giano-bundler test
      - name: Deploy CLI integration (CREATE3, recovery and idempotence)
        run: pnpm --filter @appliedblockchain/giano-contracts test:deploy:integration
      - name: Chain document migration script
        run: node --test scripts/migrate-chains-document.test.mjs

  generated-drift:
    name: generated.ts drift check (solc)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          # Pinned to the same Foundry release the repo pins everywhere else (the anvil
          # image, e2e/devnet/with-pinned-anvil.mjs). "stable" drifting past it once moved
          # test_gas_validation past its gas budget. Bump deliberately, in step with the anvil
          # pin.
          version: v1.7.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Recompile and regenerate ABIs
        working-directory: packages/contracts
        run: pnpm gen:abis
      - name: Verify final v0.9 upstream artifacts
        run: node packages/contracts/scripts/generate-entrypoint-artifacts.mjs --check
      - name: Fail on drift
        run: git diff --exit-code packages/contracts/generated.ts

  forge:
    name: Foundry tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          # Pinned to the same Foundry release the repo pins everywhere else (the anvil
          # image, e2e/devnet/with-pinned-anvil.mjs). "stable" drifting past it once moved
          # test_gas_validation past its gas budget. Bump deliberately, in step with the anvil
          # pin.
          version: v1.7.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: forge test
        working-directory: packages/contracts
        run: forge test -vvv

  forge-coverage:
    # A separate job so it runs in parallel with `forge`: coverage recompiles everything without
    # the optimizer. The thresholds and why they are below 100% are in scripts/check-coverage.mjs.
    name: Foundry coverage
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          # Same pin as the `forge` job.
          version: v1.7.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Coverage of src/ meets the thresholds
        working-directory: packages/contracts
        run: pnpm coverage:check

  solidity-analysis:
    # G25 (openspec: ci-security-gates, design D4): Slither and Aderyn on the production contracts,
    # packages/contracts/src without src/testing (scope in slither.config.json and aderyn.toml).
    # Fails on any High finding from either tool that is not in security/accepted-findings.json.
    # A job of its own because Slither runs `forge clean` and rebuilds with --build-info. Both tools
    # are pinned with an integrity hash (docs/abip-compliance.md, "Tools installed outside npm").
    name: Solidity static analysis (Slither, Aderyn)
    runs-on: ubuntu-26.04
    env:
      # Aderyn 0.6.8, released 2026-01-22. The sha256 of aderyn-x86_64-unknown-linux-gnu.tar.xz,
      # as published with the release.
      ADERYN_VERSION: 0.6.8
      ADERYN_SHA256: ffd6ca658962e211a3ac821c646f69c8e14bf1b1001cbfe091bcd4535a691e46
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          # Same pin as the `forge` job.
          version: v1.7.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The remappings resolve @openzeppelin and @account-abstraction from node_modules.
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install Slither (hash-locked requirements)
        run: |
          python -m venv "$RUNNER_TEMP/slither"
          "$RUNNER_TEMP/slither/bin/pip" install --require-hashes -r packages/contracts/requirements-ci.txt
          echo "$RUNNER_TEMP/slither/bin" >> "$GITHUB_PATH"
      - name: Install Aderyn (release binary, sha256 checked)
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -o aderyn.tar.xz \
            "https://github.com/Cyfrin/aderyn/releases/download/aderyn-v${ADERYN_VERSION}/aderyn-x86_64-unknown-linux-gnu.tar.xz"
          echo "${ADERYN_SHA256}  aderyn.tar.xz" | sha256sum -c -
          tar -xJf aderyn.tar.xz
          echo "$RUNNER_TEMP/aderyn-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"
      - name: Slither
        # Slither exits non-zero whenever it reports a finding. The register check decides, and it
        # fails when the report is missing or says Slither did not succeed.
        if: ${{ !cancelled() }}
        working-directory: packages/contracts
        # Slither keeps an existing report file instead of overwriting it, so delete any old one first.
        run: |
          mkdir -p "$RUNNER_TEMP/reports"
          rm -f "$RUNNER_TEMP/reports/slither.json" "$RUNNER_TEMP/reports/slither.sarif"
          slither . --config-file slither.config.json --json "$RUNNER_TEMP/reports/slither.json" --sarif "$RUNNER_TEMP/reports/slither.sarif" || true
      - name: Aderyn
        if: ${{ !cancelled() }}
        working-directory: packages/contracts
        run: |
          rm -f "$RUNNER_TEMP/reports/aderyn-report.json"
          aderyn . --output "$RUNNER_TEMP/reports/aderyn-report.json"
      - name: Slither High findings are fixed or accepted
        if: ${{ !cancelled() }}
        run: node scripts/check-accepted-findings.mjs --tool slither --report "$RUNNER_TEMP/reports/slither.json"
      - name: Aderyn High findings are fixed or accepted
        if: ${{ !cancelled() }}
        run: node scripts/check-accepted-findings.mjs --tool aderyn --report "$RUNNER_TEMP/reports/aderyn-report.json"
      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: solidity-analysis-reports
          path: ${{ runner.temp }}/reports/
          if-no-files-found: warn

  dependency-audit:
    # G25 (openspec: ci-security-gates, design D5) and the dependency-security capability: both
    # pnpm workspaces against the current advisory database. Fails on a high or critical advisory
    # that is not in security/accepted-findings.json for that workspace. pnpm audit reads the
    # lockfile only, so the job installs nothing and runs on fork PRs as well.
    name: Dependency audit (pnpm audit)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # pnpm audit exits non-zero whenever it lists an advisory, so its exit code is ignored and the
      # register check decides. The check fails on a missing, empty or error report, so an audit
      # that could not run fails the job. No --audit-level: it drops advisories from the list but
      # not from the counts, and the check rejects such a report. --registry on the command line
      # overrides every config file, so no file can send the audit to another server.
      # --ignore-pnpmfile: a .pnpmfile.cjs runs code inside pnpm, and its updateConfig hook can hide
      # advisories or change the output.
      - name: Audit the root workspace
        run: |
          mkdir -p "$RUNNER_TEMP/reports"
          pnpm audit --json --registry https://registry.npmjs.org/ --ignore-pnpmfile > "$RUNNER_TEMP/reports/audit-root.json" || true
      - name: Audit services/custom-example
        if: ${{ !cancelled() }}
        working-directory: services/custom-example
        run: |
          pnpm audit --json --registry https://registry.npmjs.org/ --ignore-pnpmfile > "$RUNNER_TEMP/reports/audit-custom-example.json" || true
      - name: Root workspace advisories are fixed or accepted
        if: ${{ !cancelled() }}
        run: node scripts/check-accepted-findings.mjs --tool pnpm-audit --workspace . --report "$RUNNER_TEMP/reports/audit-root.json"
      - name: services/custom-example advisories are fixed or accepted
        if: ${{ !cancelled() }}
        run: node scripts/check-accepted-findings.mjs --tool pnpm-audit --workspace services/custom-example --report "$RUNNER_TEMP/reports/audit-custom-example.json"
      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-audit-reports
          path: ${{ runner.temp }}/reports/
          if-no-files-found: warn

  secret-scan:
    # G25 (openspec: ci-security-gates, design D8): gitleaks on every commit a pull request adds.
    # Fails on any secret that is not accepted in security/accepted-findings.json, directly or
    # through an allowlist in .gitleaks.toml that names an entry. Needs no repository secret, so it
    # runs on fork PRs as well. In the release run (workflow_call) every commit on main arrived
    # through a pull request that ran this scan, so the job checks the register only.
    name: Secret scan (gitleaks)
    runs-on: ubuntu-26.04
    env:
      # gitleaks 8.30.1, released 2026-03-21. The sha256 of gitleaks_8.30.1_linux_x64.tar.gz, as
      # published in the release's checksums file.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so the pull request's base and head commits are both present.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install gitleaks (release binary, sha256 checked)
        if: github.event_name == 'pull_request'
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          mkdir gitleaks
          tar -xzf gitleaks.tar.gz -C gitleaks gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: Scan the commits of this pull request
        # --ignore-gitleaks-allow: a gitleaks:allow comment would hide a secret without a register
        # entry. --diff-merges=remerge: by default git log shows no diff for a merge commit, so a
        # secret added while resolving a merge would not be scanned; remerge shows only what the
        # merge changed beyond git's own merge. --text --no-textconv: a .gitattributes line such as
        # `file -diff` or `file binary` would otherwise hide the file's content from the diff.
        # --redact keeps the secret out of the log and the report. --exit-code 0: the register check
        # decides.
        # gitleaks ignores a git error: a range or option git rejects scans 0 commits and passes. So
        # git rev-list checks the range, and git log runs with the same options gitleaks gets. If the
        # range adds any line, gitleaks must report at least one scanned commit. gitleaks counts
        # only commits with a patch, so empty commits and clean merges are not compared.
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/reports"
          git rev-list --count "$BASE_SHA..$HEAD_SHA" > /dev/null
          # gitleaks splits --log-opts on single spaces, as the shell splits this unquoted variable.
          LOG_OPTS="--text --no-textconv --diff-merges=remerge $BASE_SHA..$HEAD_SHA"
          # shellcheck disable=SC2086
          added=$(git log $LOG_OPTS --format= --numstat | awk '$1 ~ /^[0-9]+$/ { n += $1 } END { print n + 0 }')
          if ! gitleaks git . --config .gitleaks.toml --log-opts="$LOG_OPTS" \
              --redact --ignore-gitleaks-allow --no-banner --no-color \
              --report-format json --report-path "$RUNNER_TEMP/reports/gitleaks.json" \
              --exit-code 0 2> "$RUNNER_TEMP/gitleaks.log"; then
            cat "$RUNNER_TEMP/gitleaks.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/gitleaks.log"
          scanned=$(grep -oE '[0-9]+ commits scanned' "$RUNNER_TEMP/gitleaks.log" | cut -d' ' -f1 || true)
          if [ -z "$scanned" ] || { [ "$added" -gt 0 ] && [ "$scanned" -eq 0 ]; }; then
            echo "::error::gitleaks scanned ${scanned:-no} commits, but the pull request adds $added lines"
            exit 1
          fi
      - name: Secrets are fixed or accepted
        if: github.event_name == 'pull_request'
        run: node scripts/check-accepted-findings.mjs --tool gitleaks --report "$RUNNER_TEMP/reports/gitleaks.json"
      - name: Outside a pull request, check the register only
        if: github.event_name != 'pull_request'
        run: node scripts/check-accepted-findings.mjs
      - name: Upload the report
        # The report is redacted: it names the rule, file, line and commit, never the secret.
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: secret-scan-report
          path: ${{ runner.temp }}/reports/
          if-no-files-found: warn

  ci-passed:
    # The one required check for this workflow (openspec: ci-security-gates, design D12). GitHub
    # can only require checks by name, so this job needs every other job here and fails unless each
    # one succeeded: a failed, cancelled or skipped job fails it too. A new job joins the gate by
    # being added to `needs`; scripts/check-ci-gate.mjs fails if one is missing.
    name: CI passed
    if: always()
    needs:
      - packages
      - dockerfile-policy
      - release-age-policy
      - pinned-versions
      - accepted-findings
      - wallet-api
      - bundler
      - generated-drift
      - forge
      - forge-coverage
      - solidity-analysis
      - dependency-audit
      - secret-scan
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Root devDependencies only: the check needs the yaml parser, not the workspace packages.
      - run: pnpm install --frozen-lockfile --filter @appliedblockchain/giano
      - name: CI gate check unit tests
        run: node --test scripts/check-ci-gate.test.mjs
      - name: Every other job in ci.yml is in needs, and none can fail silently
        # Parses ci.yml with a full YAML parser, so every key form reads as GitHub reads it. Fails
        # when a job is missing from needs, when this job loses `if: always()`, or when any job or
        # step has continue-on-error, which lets a failure count as success.
        run: node scripts/check-ci-gate.mjs
      - name: Every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<<"$NEEDS" > /dev/null
