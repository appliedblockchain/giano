name: Determinism

on:
  pull_request:
    paths:
      - 'packages/contracts/src/**'
      - 'packages/contracts/foundry.toml'
      # Inputs that reach the bytecode or the canonical constants without touching src/: the
      # remappings, the Solidity dependency versions, the releases, the deploy CLI and the freeze
      # itself.
      - 'packages/contracts/remappings.txt'
      - 'packages/contracts/package.json'
      - 'packages/contracts/releases/**'
      - 'packages/contracts/deploy/**'
      - 'packages/contracts/vendor/**'
      - 'packages/contracts/scripts/generate-canonical.ts'
      - 'packages/contracts/scripts/release.ts'
      - 'packages/contracts/canonical.ts'
      - '.github/workflows/determinism.yml'
  # `paths:` lives under `pull_request` only and is ignored by `workflow_call`, so both jobs
  # below run on every release — which is what a gate has to do.
  workflow_call:

# A called workflow that declares none inherits the caller's token; release.yml holds
# `packages: write` and nothing here needs it.
permissions:
  contents: read

concurrency:
  # The prefix must differ from release.yml's group, or the caller would queue behind its own
  # callee and deadlock.
  group: determinism-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  canonical:
    name: Canonical releases, addresses and code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned to the same Foundry release the repo pins everywhere else (the anvil
          # image, e2e/devnet/with-pinned-anvil.mjs). "stable" drifting past it once moved
          # test_gas_validation past its gas budget. Bump deliberately, in step with the anvil
          # pin.
          version: v1.7.1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test deployment transactions and interrupted-run recovery on anvil
        run: pnpm --filter @appliedblockchain/giano-contracts test:deploy:integration
      # Also installs the pinned solc that release:verify runs.
      - name: Unreleased contract changes (informational)
        working-directory: packages/contracts
        run: pnpm release:status
      # Every release is what the deploy CLI deploys, forever, on every chain adopted later. Its
      # committed creation code must be exactly what plain solc makes of its committed
      # standard-JSON input — no Foundry, no remappings on disk — or the release is corrupt.
      - name: Every release reproduces from its standard-JSON input with plain solc
        working-directory: packages/contracts
        run: pnpm release:verify
      # canonical.ts is generated by deploying every release, under the canonical deployer, to a
      # throwaway anvil through the deploy CLI's own code path. A diff means the addresses or the
      # code at them changed without the freeze being regenerated — never a silent re-baseline.
      - name: canonical.ts matches the deployer, the labels and the releases
        working-directory: packages/contracts
        run: |
          pnpm gen:canonical
          git diff --exit-code canonical.ts
      # The one-command local bring-up the devnet and developers use, run twice: the second run
      # must find everything in place and deploy nothing (idempotency is what makes a re-run of a
      # half-finished deployment on a real chain safe).
      - name: The deploy CLI deploys every canonical contract, then re-runs as a no-op
        working-directory: packages/contracts
        run: |
          anvil --host 127.0.0.1 --chain-id 31337 > /tmp/anvil.log 2>&1 &
          for i in $(seq 1 50); do cast chain-id --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1 && break; sleep 0.2; done
          pnpm local:deploy
          pnpm local:deploy | tee /tmp/second-run.log
          if grep -E '^\s+\+ ' /tmp/second-run.log; then
            echo "the second run deployed something; the deploy CLI is not idempotent"
            exit 1
          fi
          node --input-type=module -e "
            import fs from 'node:fs';
            const canonical = fs.readFileSync('canonical.ts', 'utf8');
            const want = (name) => canonical.match(new RegExp(name + \" = '(0x[0-9a-fA-F]{40})'\"))[1].toLowerCase();
            const { contracts } = JSON.parse(fs.readFileSync('deployments/31337.json', 'utf8'));
            const pairs = [['factory', 'CANONICAL_FACTORY'], ['walletImplementation', 'CANONICAL_IMPLEMENTATION'], ['paymasterProxy', 'CANONICAL_SPONSORSHIP_PAYMASTER'], ['paymasterImplementation', 'CANONICAL_SPONSORSHIP_PAYMASTER_IMPLEMENTATION']];
            for (const [key, name] of pairs) {
              if (contracts[key].address.toLowerCase() !== want(name)) { console.error('DETERMINISM FAILURE:', key, contracts[key].address, 'is not', name, want(name)); process.exit(1); }
              if (!canonical.toLowerCase().includes(contracts[key].codehash.toLowerCase())) { console.error('DETERMINISM FAILURE:', key, 'codehash', contracts[key].codehash, 'is not in CANONICAL_CODE'); process.exit(1); }
              console.log('OK', name, contracts[key].address, contracts[key].codehash);
            }
          "

  storage-layout:
    name: Paymaster storage layout is upgrade-safe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned to the same Foundry release the repo pins everywhere else (the anvil
          # image, e2e/devnet/with-pinned-anvil.mjs). "stable" drifting past it once moved
          # test_gas_validation past its gas budget. Bump deliberately, in step with the anvil
          # pin.
          version: v1.7.1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The paymaster holds customer funds, so a mis-ordered storage slot silently re-attributes
      # real money. The committed snapshot is a human-readable second opinion on top of ERC-7201
      # namespacing: reviewing a layout change by eye is explicitly not enough, but a diff that
      # has to be acknowledged in a pull request is.
      - name: Storage layout matches the committed snapshot
        working-directory: packages/contracts
        run: pnpm storage:check
