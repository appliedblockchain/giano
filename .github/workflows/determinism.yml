name: Determinism

on:
  pull_request:
    paths:
      - "packages/contracts/src/**"
      - "packages/contracts/foundry.toml"
      # Inputs that reach the bytecode, the fingerprints or the deterministic addresses without
      # touching src/: the remappings, the Solidity dependency versions, the releases, the deploy
      # CLI and the checks themselves.
      - "packages/contracts/remappings.txt"
      - "packages/contracts/package.json"
      - "packages/contracts/releases/**"
      - "packages/contracts/deploy/**"
      - "packages/contracts/vendor/**"
      - "packages/contracts/scripts/check-determinism.ts"
      - "packages/contracts/scripts/release.ts"
      - "packages/contracts/scripts/generate-releases.ts"
      - "packages/contracts/release-fingerprints.ts"
      - "packages/contracts/release-code.ts"
      - ".github/workflows/determinism.yml"
  # `paths:` lives under `pull_request` only and is ignored by `workflow_call`, so both jobs
  # below run on every release — which is what a gate has to do.
  workflow_call:

# A called workflow that declares none inherits the caller's token; release.yml holds
# `packages: write` and nothing here needs it.
permissions:
  contents: read

concurrency:
  # The prefix must differ from release.yml's group, or the caller would queue behind its own
  # callee and deadlock.
  group: determinism-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  canonical:
    name: Releases, fingerprints and deterministic addresses
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          # Pinned to the same Foundry release the repo pins everywhere else (the anvil
          # image, e2e/devnet/with-pinned-anvil.mjs). "stable" drifting past it once moved
          # test_gas_validation past its gas budget. Bump deliberately, in step with the anvil
          # pin.
          version: v1.7.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test deployment transactions and interrupted-run recovery on anvil
        run: pnpm --filter @appliedblockchain/giano-contracts test:deploy:integration
      # Also installs the pinned solc that release:verify runs.
      - name: Unreleased contract changes (informational)
        working-directory: packages/contracts
        run: pnpm release:status
      # Every release is what the deploy CLI deploys, forever, on every chain adopted later. Its
      # committed creation code must be exactly what plain solc makes of its committed
      # standard-JSON input — no Foundry, no remappings on disk — or the release is corrupt.
      - name: Every release reproduces from its standard-JSON input with plain solc
        working-directory: packages/contracts
        run: pnpm release:verify
      # What compiling a release reports: creation code, runtime code and its immutable references.
      - name: Release compilation reports every immutable
        working-directory: packages/contracts
        run: pnpm test:releases
      # release-fingerprints.ts holds, per release and contract, the hash of the runtime code with
      # its immutables masked; code at any address is matched against it (releaseOf). A diff means
      # a release changed without the fingerprints being regenerated.
      - name: release-fingerprints.ts matches the releases
        working-directory: packages/contracts
        run: |
          pnpm gen:releases
          git diff --exit-code release-fingerprints.ts
      # For the local class and every class whose canonical deployer is set (deploy/config.ts),
      # deploy the latest release on a throwaway anvil through CreateX, impersonating that deployer,
      # and check each address against the CREATE3 math and each code against the fingerprints.
      - name: Every configured class deployer lands on its CREATE3 addresses with release code
        working-directory: packages/contracts
        run: pnpm check:determinism
      # The one-command local bring-up the devnet and developers use, run twice: the second run
      # must find everything in place and deploy nothing (idempotency is what makes a re-run of a
      # half-finished deployment on a real chain safe).
      - name: The deploy CLI deploys every core contract, then re-runs as a no-op
        working-directory: packages/contracts
        run: |
          anvil --host 127.0.0.1 --chain-id 31337 > /tmp/anvil.log 2>&1 &
          for i in $(seq 1 50); do cast chain-id --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1 && break; sleep 0.2; done
          pnpm local:deploy
          pnpm local:deploy | tee /tmp/second-run.log
          if grep -E '^\s+\+ ' /tmp/second-run.log; then
            echo "the second run deployed something; the deploy CLI is not idempotent"
            exit 1
          fi
          # The local deployer never changes, so neither do the devnet's addresses.
          node --input-type=module -e "
            import fs from 'node:fs';
            const devnet = JSON.parse(fs.readFileSync('../../e2e/devnet/addresses.json', 'utf8'));
            const { contracts } = JSON.parse(fs.readFileSync('deployments/31337.json', 'utf8'));
            const pairs = [['factory', 'factory'], ['walletImplementation', 'implementation'], ['paymasterProxy', 'sponsorshipPaymaster'], ['paymasterImplementation', 'sponsorshipPaymasterImplementation'], ['testErc20', 'testErc20'], ['testPaymaster', 'testPaymaster']];
            for (const [key, field] of pairs) {
              const c = contracts[key];
              if (c.address.toLowerCase() !== devnet[field].toLowerCase()) { console.error('DETERMINISM FAILURE:', key, c.address, 'is not the devnet', field, devnet[field]); process.exit(1); }
              if (!c.deterministic || !c.fingerprint) { console.error('DETERMINISM FAILURE:', key, 'is not recorded as deterministic release code'); process.exit(1); }
              console.log('OK', key, c.address, c.release, c.fingerprint);
            }
          "

  storage-layout:
    name: Paymaster storage layout is upgrade-safe
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          # Pinned to the same Foundry release the repo pins everywhere else (the anvil
          # image, e2e/devnet/with-pinned-anvil.mjs). "stable" drifting past it once moved
          # test_gas_validation past its gas budget. Bump deliberately, in step with the anvil
          # pin.
          version: v1.7.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The paymaster holds customer funds, so a mis-ordered storage slot silently re-attributes
      # real money. The committed snapshot is a human-readable second opinion on top of ERC-7201
      # namespacing: reviewing a layout change by eye is explicitly not enough, but a diff that
      # has to be acknowledged in a pull request is.
      - name: Storage layout matches the committed snapshot
        working-directory: packages/contracts
        run: pnpm storage:check
