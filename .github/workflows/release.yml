name: Release

on:
  push:
    branches: [main]
    tags: ['v*']

# The SHA is in the group key because at most one run per group may be pending: keyed on ref alone,
# a burst of merges leaves the middle ones cancelled before they publish, and each carries its own
# snapshot version that nothing else will ever publish. Distinct SHAs now never share a group, so
# nothing queues and nothing is dropped. What still shares one is a re-run at the same SHA, and the
# string form keeps cancel-in-progress false there: a cancellation between the third and fourth of
# six sequential publishes leaves a half-released fixed group, the one state npm's immutability
# makes unrecoverable.
concurrency: release-${{ github.ref }}-${{ github.sha }}

permissions:
  contents: read
  packages: write

jobs:
  # The gate runs on the main path only. A tag points at a commit that already passed it on the
  # way in, so the release job asserts that it did — by ancestry and by this workflow's own run
  # history — instead of spending another ~4m proving the same tree twice.
  ci:
    name: CI
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  determinism:
    name: Determinism
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/determinism.yml

  snapshot:
    name: Publish snapshot
    if: github.ref == 'refs/heads/main'
    needs: [ci, determinism]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build publishable packages
        # Every publishable package ships only `dist` (see its `files`), so all of them must be
        # built here — and in dependency order, because each tsup dts build resolves its workspace
        # deps through their built `dist` types, not their source.
        run: |
          pnpm --filter @appliedblockchain/giano-contracts build:ts
          pnpm --filter @appliedblockchain/giano-wallet-transport build
          pnpm --filter @appliedblockchain/giano-wallet-core build
          pnpm --filter @appliedblockchain/giano-connector build
          pnpm --filter @appliedblockchain/giano-wallet-kit build
          pnpm --filter @appliedblockchain/giano-paymaster-sdk build
      - name: Configure GitHub Packages auth
        # auth only — the publish registry comes from each package's own publishConfig
        run: echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" >> "$HOME/.npmrc"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish a snapshot of this commit
        run: |
          # Without this guard, the merge of a release PR — which has consumed every changeset —
          # would publish the STABLE version under the `main` dist-tag, ahead of its own tag.
          pnpm changeset status --output=/tmp/status.json
          if [ "$(jq '[.releases[] | select(.type != "none")] | length' /tmp/status.json)" -eq 0 ]; then
            echo "no pending changesets — this commit releases nothing"
            exit 0
          fi
          pnpm changeset version --snapshot main
          pnpm changeset publish --tag main --no-git-tag

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the six per-package git tags changeset publish creates
      packages: write
      actions: read     # read this workflow's own run history, to prove the gate passed
    steps:
      - uses: actions/checkout@v7
        with:
          # merge-base needs real history, not the default shallow clone
          fetch-depth: 0
      - name: The merge gate passed at this exact commit
        # `snapshot` needs [ci, determinism], so a successful main run of THIS workflow at this SHA
        # is the gate having passed — one query, and no list of job names here to drift out of step
        # with ci.yml. Without it the tag path only assumes the gate ran: required checks on main
        # are still off (§5.5), so a red or still-running gate does not keep a commit off main, and
        # a tag on that commit would publish six immutable versions over it.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs" \
                -f head_sha="$GITHUB_SHA" -f branch=main -f event=push -f status=success \
                --jq .total_count)
          [ "${n:-0}" -gt 0 ] \
            || { echo "no successful main run of release.yml at $GITHUB_SHA — the gate has not passed"; exit 1; }

      - name: This tag is on main, and names the version it publishes
        # Ancestry catches what the run query cannot: a commit that was on main, passed the gate,
        # and has since been force-pushed away.
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD \
            || { echo "$GITHUB_SHA is not on main — it never passed the merge gate"; exit 1; }
          want="${GITHUB_REF_NAME#v}"
          for p in contracts wallet-transport wallet-core connector wallet-kit paymaster-sdk; do
            got=$(jq -r .version "packages/$p/package.json")
            [ "$got" = "$want" ] || { echo "packages/$p is $got, tag says $want"; exit 1; }
          done
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build publishable packages
        run: |
          pnpm --filter @appliedblockchain/giano-contracts build:ts
          pnpm --filter @appliedblockchain/giano-wallet-transport build
          pnpm --filter @appliedblockchain/giano-wallet-core build
          pnpm --filter @appliedblockchain/giano-connector build
          pnpm --filter @appliedblockchain/giano-wallet-kit build
          pnpm --filter @appliedblockchain/giano-paymaster-sdk build
      - name: Configure GitHub Packages auth
        run: echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" >> "$HOME/.npmrc"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        run: |
          pnpm changeset publish
          git push --tags
