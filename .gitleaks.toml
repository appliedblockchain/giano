# gitleaks configuration (openspec: ci-security-gates, design D8). CI runs gitleaks with this file on
# the commits of each pull request (ci.yml, job "Secret scan (gitleaks)").
#
# Every default rule stays on. scripts/check-accepted-findings.mjs rejects anything here except
# the title, [extend] with useDefault = true, allowlist tables, and [[rules]] whose id starts with
# giano-. Each allowlist's description starts with the ID of the gitleaks entry in
# security/accepted-findings.json that accepts it.
title = "Giano gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "AF-008: the ten public Anvil development keys, derived from the test mnemonic"
# Each regex matches the whole secret, so a string that only contains one of these keys still fails.
regexes = [
  '(?i)^(0x)?ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80$',
  '(?i)^(0x)?59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d$',
  '(?i)^(0x)?5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a$',
  '(?i)^(0x)?7c852118294e51e653712a81e05800f419141751be58f605c371e15141b007a6$',
  '(?i)^(0x)?47e179ec197488593b187f80a00eb0da91f1b9d0b13f8733639f19c30a34926a$',
  '(?i)^(0x)?8b3a350cf5c34c9194ca85829a2df0ec3153be0318b5e2d3348e872092edffba$',
  '(?i)^(0x)?92db14e403b83dfe3df233f83dfa3a0d7096f21ca9b0d6d6b8d88b2b4ec1564e$',
  '(?i)^(0x)?4bbbf85ce3377467afe5d46f804f221813b2bb87f24d81f60f1fcdbf7cbf4356$',
  '(?i)^(0x)?dbda1821b80551c9d65939329250298aa3472ba22feea921c0cf5d620ea67b97$',
  '(?i)^(0x)?2a871d0798f97d79848a013d4936a73bf4cc922c825d33c1cf7073dff6d409c6$',
]

[[allowlists]]
description = "AF-009: Ethereum addresses, which are public"
# The whole secret is 0x and exactly 40 hex characters. A private key has 64, so it still fails.
regexes = [
  '(?i)^0x[0-9a-f]{40}$',
]

[[allowlists]]
description = "AF-010: the public Infura key that forge-std ships in StdChains.sol"
# Only this exact key. Any other Infura key still fails giano-infura-key.
regexes = [
  '(?i)^b9794ad1ddf84dfb8c34d6bb5dca2001$',
]

# RPC provider keys. The default rules do not detect a key in an RPC URL, and this repository has
# leaked one before (#244). Each rule captures only the key, so --redact hides it in the report.
[[rules]]
id = "giano-infura-key"
description = "Infura project ID in an RPC URL"
regex = '(?i)\binfura\.io/(?:ws/)?v3/([0-9a-f]{32})\b'
keywords = ["infura.io"]

[[rules]]
id = "giano-alchemy-key"
description = "Alchemy API key in an RPC URL"
regex = '(?i)\balchemy(?:api)?\.(?:com|io)/v2/([a-z0-9_-]{32})(?:[^a-z0-9_-]|$)'
keywords = ["alchemy"]

[[rules]]
id = "giano-quicknode-key"
description = "QuickNode token in an RPC URL"
regex = '(?i)\.quiknode\.pro/([a-z0-9]{32,64})(?:[^a-z0-9]|$)'
keywords = ["quiknode.pro"]

[[rules]]
id = "giano-ankr-key"
description = "Ankr API key in an RPC URL"
regex = '(?i)\brpc\.ankr\.com/[a-z0-9_]+/([0-9a-f]{64})\b'
keywords = ["rpc.ankr.com"]
