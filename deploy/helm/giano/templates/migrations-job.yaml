{{- if .Values.walletApi.runMigrationsJob }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate
  labels: {{- include "giano.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        giano/component: migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: {{ include "giano.image" (dict "root" . "name" .Values.walletApi.image) }}
          command: ["node", "dist/migrate.js"]
          envFrom:
            - secretRef:
                name: {{ required "secrets.existingSecret is required" .Values.secrets.existingSecret }}
{{- end }}
