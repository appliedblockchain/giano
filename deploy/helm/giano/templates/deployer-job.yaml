{{- if .Values.deployer.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-deploy-contracts
  labels: {{- include "giano.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        giano/component: deployer
    spec:
      restartPolicy: Never
      containers:
        - name: deployer
          image: {{ include "giano.image" (dict "root" . "name" .Values.deployer.image) }}
          env:
            - name: RPC_URL
              value: {{ .Values.config.rpcUrl | quote }}
            - name: CHAIN_ID
              value: {{ .Values.config.chainId | quote }}
            - name: DEPLOY_TESTING
              value: {{ .Values.deployer.deployTesting | quote }}
          envFrom:
            - secretRef:
                name: {{ required "secrets.existingSecret is required" .Values.secrets.existingSecret }}
{{- end }}
