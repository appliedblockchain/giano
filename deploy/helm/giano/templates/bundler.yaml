{{- if .Values.bundler.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-bundler
  labels: {{- include "giano.labels" . | nindent 4 }}
spec:
  # One replica, replaced rather than rolled: executors track their nonces in memory, and two
  # pods sharing a key would race for them.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      giano/component: bundler
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        giano/component: bundler
    spec:
      containers:
        - name: bundler
          image: {{ include "giano.image" (dict "root" . "name" .Values.bundler.image) }}
          ports:
            - containerPort: 4337
          env:
            # The chain document wallet-api reads; with the single-chain scalars, its one-entry form.
            - name: GIANO_CHAINS
              {{- if .Values.config.chains }}
              value: {{ toJson .Values.config.chains | quote }}
              {{- else }}
              {{- $chain := dict "chainId" .Values.config.chainId "name" (printf "chain %v" .Values.config.chainId) "rpcUrl" .Values.config.rpcUrl }}
              {{- with .Values.config.entryPointAddress }}{{- $_ := set $chain "entryPoint" . }}{{- end }}
              value: {{ toJson (list $chain) | quote }}
              {{- end }}
          envFrom:
            - secretRef:
                name: {{ required "secrets.existingSecret is required" .Values.secrets.existingSecret }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-bundler
  labels: {{- include "giano.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    giano/component: bundler
  ports:
    - port: 4337
      targetPort: 4337
{{- end }}
