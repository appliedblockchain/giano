# Giano Helm values. External Postgres by default; each workload's secrets come from its own existingSecret.
global:
  imageRegistry: ghcr.io/appliedblockchain
  # image tags default to .Chart.AppVersion when empty
  imageTag: ""

# --- chain / RP config shared by wallet-api and wallet-web ---
config:
  # an entry of services/wallet-api/src/environments.ts; `reference` has no platform console
  environment: reference
  # SINGLE-CHAIN (on-premises profile, MC-88): the scalars below are the complete
  # configuration. MULTI-CHAIN (standalone profile): set `chains` / `walletWeb.chains`
  # instead — JSON documents passed through verbatim, because a per-field template cannot
  # express a variable-length list (MC-94). Setting both is a wallet-api boot error.
  #
  # chains: the backend chain document (packages/contracts/chains.ts), read by wallet-api and
  # the in-chart bundler alike — shared fields, then a section per service, e.g.
  #   chains:
  #     - chainId: 8453
  #       name: Base
  #       rpcUrl: https://…
  #       walletApi:
  #         policy: { allowedPaymasters: ["0x…"] }
  #       bundler:
  #         chainType: op-stack
  # With bundler.enabled, each chain submits to the in-chart bundler at /<chainId>; otherwise
  # give each entry a walletApi.bundlerUrl.
  chains: []
  chainId: 8453
  # node RPC and bundler for wallet-api; the wallet UI reaches both through wallet-api's relays
  # (/api/v1/rpc/<chainId>, /api/v1/bundler/<chainId>), so neither URL is published to a browser.
  rpcUrl: "" # e.g. https://mainnet.base.org (a keyed provider URL is fine here)
  bundlerUrl: "" # leave empty to use the in-chart bundler service
  rpId: "" # e.g. wallet.clientapp.com — IRREVERSIBLE per deployment
  rpName: Giano Wallet
  # origins accepted during ceremonies (wallet-web origin) and by CORS (dApp origins)
  expectedOrigins: [] # e.g. ["https://wallet.clientapp.com"]
  allowedDappOrigins: [] # e.g. ["https://app.clientapp.com"]
  corsOrigins: [] # dApp origins polling the public receipt endpoint
  # optional explicit addresses; default from the contracts registry for chainId
  entryPointAddress: ""
  factoryAddress: ""
  paymasterAddress: ""
  openRegistration: false

# --- secrets ---
# Each workload reads only its own existing k8s Secret (walletApi.existingSecret,
# bundler.existingSecret), so a compromised pod exposes only its own keys. The contracts deployer
# Job gets no Secret. Never inline production keys in values.

postgres:
  # external by default — set the DSN in walletApi.existingSecret's DATABASE_URL
  external: true

walletApi:
  replicas: 2
  image: giano-wallet-api
  # k8s Secret that wallet-api loads whole. It must provide DATABASE_URL and GIANO_DEPLOYMENT_CLASS,
  # and, when GIANO_DEPLOYMENT_CLASS is testnet or production, METRICS_BEARER_TOKEN (at least
  # 16 characters). Without that token wallet-api refuses to boot, because GET /metrics would be
  # open. It may also hold wallet-api's optional secrets. The migrations Job reads only its
  # DATABASE_URL. Never put BUNDLER_EXECUTOR_PRIVATE_KEYS or DEPLOYER_PRIVATE_KEY in it:
  # wallet-api faces the internet.
  existingSecret: ""
  runMigrationsJob: true # run a pre-install/upgrade Job instead of RUN_MIGRATIONS on the pod
  # TRUST_PROXY: the peers allowed to set X-Forwarded-For (IPs, CIDRs, loopback, linklocal,
  # uniquelocal). The ingress controller and the wallet-web nginx must fall inside it, or
  # request.ip is the proxy and the per-IP ceremony rate limit applies to the whole tenant.
  # Narrow it to the cluster's pod CIDR where you know it. Never "true".
  trustProxy: uniquelocal
  resources: {}

walletWeb:
  replicas: 2
  image: giano-wallet-web
  # multi-chain: one wallet descriptor per served chain ({chainId, name, factoryAddress,
  # sponsorship}); empty = the single-chain scalars in `config`. rpcUrl/bundlerUrl default to
  # wallet-api's relays for that chain.
  chains: []
  resources: {}

bundler:
  enabled: false
  image: giano-bundler
  # k8s Secret with BUNDLER_EXECUTOR_PRIVATE_KEYS (comma-separated), the only key the bundler
  # reads from it. Required when enabled. It must be a different Secret from
  # walletApi.existingSecret: the executor keys are funded. ALTO_EXECUTOR_PRIVATE_KEYS is refused
  # at boot — rename the key.
  # GIANO_DEV_MODE is deliberately not exposed: the chart targets real chains, so the bundler's
  # Anvil-key guard stays armed. Local devnets use docker compose, which sets it.
  existingSecret: ""

deployer:
  # one-shot pre-install hook Job: verifies that the Giano contracts are on config.chainId's chain,
  # with a release's code (by release fingerprint), and writes the chain's address registry entry.
  # It needs no key, loads no Secret and sends nothing. NEVER give it DEPLOYER_PRIVATE_KEY: the
  # canonical deployer keys (one per network class) are Applied Blockchain development-team keys kept
  # in 1Password (docs/key-ceremony.md) and never leave the deploying shell. If a contract is missing,
  # the Job fails: adopting a chain is Applied Blockchain's operation, not part of a client install.
  enabled: false
  image: giano-contracts-deployer
  # the sponsorship paymaster's sole ROLE_ADMIN (a TimelockController in production); required
  roleAdmin: ""
  # the chain's network class, mainnet or testnet: which canonical deployer's deterministic addresses
  # the Job expects. Required for any chain but a local one (31337/31338), unless chainProfile is set.
  network: ""
  # the chain's profile, deploy/chains/<profile>.json verbatim
  # (--set-file deployer.chainProfile=…): its class, address overrides and paymaster parameters.
  chainProfile: ""
  # the chain's committed record, packages/contracts/deployments/<chainId>.json verbatim
  # (--set-file deployer.deploymentRecord=…). Set it for any chain adopted with an override or by
  # another key: without it the Job looks for the contracts at the deterministic addresses only.
  deploymentRecord: ""
  deployTesting: false

ingress:
  enabled: true
  className: nginx
  # wallet origin host; /.well-known/webauthn and /api route to wallet-api, / to wallet-web
  walletHost: ""
  tls: true
  annotations: {}

serviceMonitor:
  enabled: false # Prometheus Operator ServiceMonitor for wallet-api metrics
