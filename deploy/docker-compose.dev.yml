# Local development stack: postgres + wallet-api built from source + anvil devnet +
# giano-bundler. From the repo root:
#   docker compose -f deploy/docker-compose.dev.yml up --build
# Uses the well-known anvil accounts — never reuse these keys anywhere real.
name: giano-dev

# The backend chain document wallet-api and the bundler both read (packages/contracts/chains.ts).
# The local chain is not in the committed registry, so its addresses come from hh:initlocal.
x-giano-chains: &giano-chains |
  [
    {
      "chainId": 31337, "name": "Local devnet", "rpcUrl": "http://anvil:8545",
      "entryPoint": "${ENTRYPOINT_ADDRESS:-0x0000000071727De22E5E9d8BAf0edAc6f37da032}",
      "walletApi": { "factory": "${FACTORY_ADDRESS:?run hh:initlocal and export FACTORY_ADDRESS}" }
    }
  ]

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: giano
      POSTGRES_USER: giano
      POSTGRES_PASSWORD: giano
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U giano -d giano']
      interval: 5s
      timeout: 3s
      retries: 10

  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ['anvil', '--host', '0.0.0.0', '--chain-id', '31337']
    ports:
      - '8545:8545'

  # giano-bundler waits for the EntryPoint to appear, so it can start before hh:initlocal runs.
  bundler:
    build:
      context: ..
      dockerfile: services/bundler/Dockerfile
    depends_on:
      - anvil
    environment:
      GIANO_CHAINS: *giano-chains
      BUNDLER_EXECUTOR_PRIVATE_KEYS: ${BUNDLER_EXECUTOR_PRIVATE_KEYS:-0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
      GIANO_DEV_MODE: 'true'
    ports:
      - '4337:4337'

  # The dev tenant. wallet-api never creates a tenant itself (operators do, in the paymaster
  # console), so this one-shot creates it before wallet-api starts — insert-only, so an existing
  # tenant is left as it is and `down -v` is what resets it. See src/tenant-fixtures.ts.
  tenant-fixtures:
    build: &wallet-api-build
      context: ..
      dockerfile: services/wallet-api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    command: ['node', 'dist/tenant-fixtures.js']
    restart: 'no'
    # the image's healthcheck probes the API, which this container never starts
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgres://giano:giano@postgres:5432/giano
      NODE_ENV: development
      # single dev tenant: the vite dev server (5173) is the wallet origin; 4000 is the
      # legacy demo origin.
      TENANT_FIXTURES: |
        [
          {
            "slug": "dev",
            "walletOrigin": "http://localhost:5173",
            "rpId": "localhost",
            "rpName": "Giano Dev",
            "expectedOrigins": ["http://localhost:4000", "http://localhost:5173"],
            "corsOrigins": ["http://localhost:4000", "http://localhost:5173"],
            "openRegistration": true,
            "adminKeys": ["dev-admin-key-local"]
          }
        ]

  wallet-api:
    build: *wallet-api-build
    depends_on:
      postgres:
        condition: service_healthy
      tenant-fixtures:
        condition: service_completed_successfully
    ports:
      - '8080:8080'
    environment:
      NODE_ENV: development
      # What the deployment is, as distinct from how it was built — it is what gates whether a
      # signing key may sit in an environment variable (see services/wallet-api/src/config.ts).
      GIANO_DEPLOYMENT_CLASS: development
      DATABASE_URL: postgres://giano:giano@postgres:5432/giano
      RUN_MIGRATIONS: 'true'
      GIANO_CHAINS: *giano-chains
      BUNDLER_BASE_URL: http://bundler:4337
      LOG_LEVEL: debug
