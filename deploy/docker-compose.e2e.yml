# E2E stack: instant-boot devnet (pre-baked state: EntryPoint v0.7 + Giano factory +
# testing contracts), alto bundler, wallet-api, wallet-web. The dApp fixture and
# Playwright run on the host (e2e/). From the repo root:
#   docker compose -f deploy/docker-compose.e2e.yml up --build
name: giano-e2e

services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ['anvil', '--host', '0.0.0.0', '--chain-id', '31337', '--load-state', '/devnet/state.hex']
    volumes:
      - ../e2e/devnet/state.hex:/devnet/state.hex:ro
    ports:
      - '8545:8545'

  alto:
    image: node:22-alpine
    depends_on:
      - anvil
    command: >
      npx -y @pimlico/alto@0.0.18 run
      --rpc-url http://anvil:8545
      --entrypoints 0x0000000071727De22E5E9d8BAf0edAc6f37da032
      --executor-private-keys 0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
      --utility-private-key 0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d
      --safe-mode false
      --port 4337
    ports:
      - '4337:4337'

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: giano
      POSTGRES_USER: giano
      POSTGRES_PASSWORD: giano
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U giano -d giano']
      interval: 5s
      timeout: 3s
      retries: 10

  wallet-api:
    build:
      context: ..
      dockerfile: services/wallet-api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://giano:giano@postgres:5432/giano
      RUN_MIGRATIONS: 'true'
      RP_ID: wallet.localtest.me
      RP_NAME: Giano E2E
      EXPECTED_ORIGINS: http://wallet.localtest.me:8081
      CHAIN_ID: '31337'
      RPC_URL: http://anvil:8545
      BUNDLER_URL: http://alto:4337
      ENTRYPOINT_ADDRESS: '0x0000000071727De22E5E9d8BAf0edAc6f37da032'
      FACTORY_ADDRESS: '0x26dCd29390eba3B22BcCbd2143989E5994Ac7050'
      OPEN_REGISTRATION: 'true'
      ADMIN_API_KEYS: e2e-admin-key
      LOG_LEVEL: info

  wallet-web:
    build:
      context: ..
      dockerfile: services/wallet-web/Dockerfile
    depends_on:
      - wallet-api
    ports:
      - '8081:8080'
    environment:
      GIANO_CHAIN_ID: '31337'
      # as seen from the BROWSER
      GIANO_RPC_URL: http://localhost:8545
      GIANO_BUNDLER_URL: http://localhost:4337
      GIANO_WALLET_API_UPSTREAM: http://wallet-api:8080
      GIANO_FACTORY_ADDRESS: '0x26dCd29390eba3B22BcCbd2143989E5994Ac7050'
      GIANO_ALLOWED_DAPP_ORIGINS: '["http://app.localtest.me:4400"]'
      GIANO_RP_ID: wallet.localtest.me
      GIANO_BRAND_NAME: Giano E2E
