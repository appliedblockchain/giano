# Reference deployment for client projects: copy this file into your stack and fill in
# the environment. Giano is never centrally hosted — every client project runs these
# containers itself. See services/wallet-api/README.md for the full env matrix.
name: giano

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: giano
      POSTGRES_USER: giano
      # supply via secret/env file in real deployments
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - giano-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U giano -d giano']
      interval: 5s
      timeout: 3s
      retries: 10

  wallet-api:
    image: ghcr.io/appliedblockchain/giano-wallet-api:${GIANO_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '8080:8080'
    environment:
      DATABASE_URL: postgres://giano:${POSTGRES_PASSWORD}@postgres:5432/giano
      # apply pending migrations on boot (or run `node dist/migrate.js` as a one-shot job)
      RUN_MIGRATIONS: 'true'

      # --- chain ---
      CHAIN_ID: ${CHAIN_ID:?e.g. 8453}
      RPC_URL: ${RPC_URL:?JSON-RPC endpoint}
      BUNDLER_URL: ${BUNDLER_URL:?ERC-4337 bundler endpoint}
      # ENTRYPOINT_ADDRESS / FACTORY_ADDRESS default from the @appliedblockchain/giano-contracts
      # registry for CHAIN_ID; set explicitly for chains not in the registry.
      # ENTRYPOINT_ADDRESS: '0x0000000071727De22E5E9d8BAf0edAc6f37da032'
      # FACTORY_ADDRESS: ''

      # --- tenants (JSON array, upserted by slug at boot) ---
      # One entry per client project. rpId is IRREVERSIBLE per tenant (passkeys bind to
      # it) and must equal the walletOrigin host. openRegistration=false keeps
      # registration server-to-server via the tenant's adminKeys.
      # Example:
      #   [{"slug":"clientapp",
      #     "walletOrigin":"https://wallet.clientapp.com",
      #     "rpName":"ClientApp Wallet",
      #     "allowedDappOrigins":["https://app.clientapp.com"],
      #     "corsOrigins":["https://app.clientapp.com"],
      #     "openRegistration":false,
      #     "adminKeys":["<long-random-secret>"]}]
      TENANTS_SEED: ${TENANTS_SEED:?JSON array of tenants — see services/wallet-api/README.md}

      # --- userop relay policy DEFAULTS (integers; fees in wei) — a tenant's policy
      #     jsonb may override any field per tenant ---
      USEROP_MAX_CALL_GAS: ${USEROP_MAX_CALL_GAS:-5000000}
      USEROP_MAX_VERIFICATION_GAS: ${USEROP_MAX_VERIFICATION_GAS:-5000000}
      USEROP_MAX_FEE_PER_GAS: ${USEROP_MAX_FEE_PER_GAS:-500000000000}
      USEROP_MAX_PRIORITY_FEE_PER_GAS: ${USEROP_MAX_PRIORITY_FEE_PER_GAS:-500000000000}
      # comma-separated contract addresses; empty = unrestricted
      USEROP_ALLOWED_TARGETS: ${USEROP_ALLOWED_TARGETS:-}
      USEROP_ALLOWED_PAYMASTERS: ${USEROP_ALLOWED_PAYMASTERS:-}
      # per-tenant relay rate limit default (tenant policy.relayRateLimitPerMinute overrides)
      USEROP_RATE_LIMIT_PER_MINUTE: ${USEROP_RATE_LIMIT_PER_MINUTE:-60}

      # --- sessions / challenges / observability ---
      CHALLENGE_TTL_SECONDS: ${CHALLENGE_TTL_SECONDS:-300}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}
      # when set, GET /metrics requires this bearer token (recommended in production)
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}

  wallet-web:
    image: ghcr.io/appliedblockchain/giano-wallet-web:${GIANO_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      - wallet-api
    ports:
      - '8081:8080'
    environment:
      # the dedicated wallet origin, e.g. https://wallet.clientapp.com behind your TLS proxy
      GIANO_CHAIN_ID: ${CHAIN_ID:?}
      GIANO_RPC_URL: ${RPC_URL:?}
      GIANO_BUNDLER_URL: ${BUNDLER_URL:?}
      # nginx proxies /api and /.well-known/webauthn here (same-origin)
      GIANO_WALLET_API_UPSTREAM: http://wallet-api:8080
      # defaults from the contracts registry when empty and CHAIN_ID is known
      GIANO_FACTORY_ADDRESS: ${FACTORY_ADDRESS:-}
      # JSON array of dApp origins allowed to connect, e.g. ["https://app.clientapp.com"]
      GIANO_ALLOWED_DAPP_ORIGINS: ${ALLOWED_DAPP_ORIGINS:?e.g. ["https://app.clientapp.com"]}
      GIANO_RP_ID: ${RP_ID:?}
      GIANO_BRAND_NAME: ${BRAND_NAME:-Giano Wallet}

volumes:
  giano-pgdata:
